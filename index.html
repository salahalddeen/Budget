<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mein Monatsbudget</title>
<meta name="theme-color" content="#1D6B58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE7; --line:#D6DDD6;
  --fg:#17201C; --muted:#5B6A62; --accent:#1D6B58; --accent-fg:#FFFFFF; --accent-soft:#D9EBE4;
  --good:#1B7A43; --bad:#B42318; --warn:#9A6200;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1412; --surface:#171E1B; --sunk:#111815; --line:#2A3530;
  --fg:#E5ECE8; --muted:#93A39A; --accent:#5EC2A3; --accent-fg:#0B1F19; --accent-soft:#1B3530;
  --good:#5BCB8A; --bad:#FF8D82; --warn:#E6B54F; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h3{font-size:1rem}

.top{display:flex;flex-direction:column;gap:14px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.05rem;font-weight:700;color:var(--muted)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav h1{font-size:1.6rem;min-width:9.5ch;text-align:center}
.prange{font-size:.72rem;font-weight:600;color:var(--muted);margin-left:6px;white-space:nowrap}
.lock{font-size:.75rem;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 8px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.1rem;line-height:1;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.todaybtn{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;font-size:.85rem;padding:4px 6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi span{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--display);font-size:1.25rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b.pos{color:var(--good)} .kpi b.neg{color:var(--bad)}
.kpi small{color:var(--muted);font-size:.74rem}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:none;padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.notice{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);font-size:.88rem}
main{margin-top:20px;display:flex;flex-direction:column;gap:26px}
section{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sechead h2{font-size:1.15rem}
.sechead .sum{font-weight:600}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.panel.pad{padding:14px}

.hero{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.hero .big{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero b.amount{font-family:var(--display);font-size:1.9rem}
.hero.neg{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.hero.neg b.amount{color:var(--bad)}
details.calc summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem}
.calcrows{display:flex;flex-direction:column;margin-top:8px}
.calcrow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed color-mix(in srgb,var(--muted) 35%,transparent);font-size:.9rem}
.calcrow:last-child{border-bottom:0}
.calcrow.total{font-weight:700;border-top:1px solid var(--muted);border-bottom:0;margin-top:2px}

.warns{display:flex;flex-direction:column;gap:6px}
.warnrow{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;font-size:.9rem;background:color-mix(in srgb,var(--warn) 13%,transparent)}
.warnrow.bad{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.warnrow.info{background:var(--sunk)}
.warnrow i{font-style:normal;font-weight:700}

.bars{display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.bar:last-child{border-bottom:0}
.bar .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .lbl em{font-style:normal;color:var(--muted);font-size:.8rem;margin-left:6px}
.bar .val{text-align:right}
.bar .val small{display:block;color:var(--muted);font-size:.75rem}
.cmp{font-size:.75rem;font-weight:600}
.cmp.up{color:var(--bad)} .cmp.down{color:var(--good)}
.track{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:3px}
.fill.muted{background:var(--muted);opacity:.55}
.fill.good{background:var(--good)} .fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}

.chip{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

.addform{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.flabel{font-size:.74rem;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:1/-1}
.fbtn{justify-content:flex-end}
.limitinfo{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=month],input[type=number],input[type=search],select{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input:hover,select:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
input:disabled,select:disabled{opacity:.6;cursor:not-allowed}
input.amt{text-align:right;font-variant-numeric:tabular-nums}
.newname{margin-top:6px}
.primary{border:0;background:var(--accent);color:var(--accent-fg);font-weight:600;padding:10px 14px;border-radius:8px;cursor:pointer;width:100%}
.primary:hover{filter:brightness(1.07)}
.secondary{border:1px solid var(--line);background:var(--surface);font-weight:600;padding:8px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.secondary:hover{border-color:var(--accent);color:var(--accent)}
.secondary.on{background:color-mix(in srgb,var(--good) 14%,transparent);border-color:transparent;color:var(--good)}
.secondary.danger:hover{border-color:var(--bad);color:var(--bad)}
.ghost{border:1px dashed var(--line);background:none;color:var(--accent);font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;align-self:flex-start}
.ghost:hover{border-color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0;font-size:.88rem;text-align:left}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) 8.5rem;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{min-width:0}
.row .name small{display:block;color:var(--muted);font-size:.78rem}
.row.w3{grid-template-columns:minmax(0,1fr) 8rem auto}
.paid{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.paid input{accent-color:var(--accent);width:17px;height:17px}

.erow{display:grid;grid-template-columns:4rem minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .d{color:var(--muted);font-size:.85rem}
.erow .t{min-width:0}
.erow .t b{font-weight:600}
.erow .t span{color:var(--muted);font-size:.85rem}
.erow .t small{display:block;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.erow .amt.in{color:var(--good)}
.acts{display:flex;gap:2px}
.del,.act{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 7px;border-radius:6px;font-size:.85rem;white-space:nowrap}
.act:hover{color:var(--accent);background:var(--accent-soft)}
.del:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.del.armed{color:#fff;background:var(--bad)}
.empty{padding:22px 4px;color:var(--muted);text-align:center}

.srow{display:grid;grid-template-columns:minmax(0,1fr) 7.5rem auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.colhead{display:grid;gap:8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding-top:6px}
.colhead .r{text-align:right}
.cat{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cat:last-child{border-bottom:0}
.cathead{display:grid;grid-template-columns:minmax(0,1fr) 7rem 7rem auto;gap:8px;align-items:center}
.subrow{display:grid;grid-template-columns:minmax(0,1fr) 7rem 7rem auto;gap:8px;align-items:center;padding-left:14px;font-size:.9rem}
.subadd{max-width:14rem;padding:6px 10px !important;border-radius:999px !important;font-size:.85rem;margin-left:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.card{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.card:last-child{border-bottom:0}
.card .top2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:1px;min-width:0}
.stat span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat b{font-variant-numeric:tabular-nums;font-size:1.05rem}
.stat.hl{background:var(--accent-soft)} .stat.hl b{color:var(--accent);font-size:1.25rem;font-family:var(--display)}
.defgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
th.l,td.l{text-align:left}
td.wrap{white-space:normal;min-width:9rem}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
td.pos{color:var(--good)} td.neg{color:var(--bad)}
tr.cur td{background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;max-width:calc(100% - 32px);z-index:40}

.modal{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:30;display:grid;place-items:end center;padding:16px}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 20px);overflow:auto;background:var(--surface);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.modal{place-items:center}}

.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.loginbox{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px}
.loginbox h1{font-size:1.6rem}
.or{text-align:center;color:var(--muted);font-size:.85rem}
.err{color:var(--bad);font-size:.88rem;margin:0}

/* Bericht / PDF */
#report{position:fixed;inset:0;z-index:50;background:#e9ecea;overflow:auto;color:#17201C}
.rtool{position:sticky;top:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px;background:#1D6B58;z-index:2}
.rtool button{border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.rtool .p{background:#fff;color:#1D6B58} .rtool .c{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)}
.rtool span{color:#fff;font-size:.85rem;align-self:center}
.paper{background:#fff;max-width:800px;margin:18px auto 40px;padding:36px 40px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-family:var(--body);font-size:12.5px;line-height:1.45}
.paper .rh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:3px solid #1D6B58;padding-bottom:12px;margin-bottom:18px}
.paper h1{font-family:var(--display);font-size:22px;color:#1D6B58;margin:0}
.paper .rmeta{text-align:right;color:#5B6A62;font-size:11.5px}
.paper h2{font-family:var(--display);font-size:15px;margin:22px 0 8px;color:#17201C;border-bottom:1px solid #D6DDD6;padding-bottom:4px}
.paper table{width:100%;border-collapse:collapse;font-size:11.5px}
.paper th{background:#1D6B58;color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:6px 7px;text-align:right}
.paper td{padding:5px 7px;border-bottom:1px solid #E1E6E1;text-align:right;white-space:normal;color:#17201C}
.paper th.l,.paper td.l{text-align:left}
.paper tr:nth-child(even) td{background:#F6F8F5}
.paper tr.tot td{font-weight:700;background:#E4EFEA;border-top:2px solid #1D6B58}
.paper .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paper .sum div{border:1px solid #D6DDD6;border-radius:6px;padding:8px 10px}
.paper .sum span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#5B6A62}
.paper .sum b{font-size:14px}
.paper .sum .hl{background:#E4EFEA;border-color:#1D6B58}
.paper .sum .hl b{color:#1D6B58;font-size:16px}
.paper .note{color:#5B6A62;font-size:10.5px;margin-top:14px}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px}
.paper .sig div{border-top:1px solid #17201C;padding-top:4px;font-size:10.5px;color:#5B6A62}
.paper .pos{color:#1B7A43} .paper .neg{color:#B42318}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important;padding:0}
  body > *:not(#report){display:none!important}
  #report{position:static;background:#fff;overflow:visible}
  .rtool{display:none!important}
  .paper{box-shadow:none;margin:0;padding:0;max-width:none}
  .paper tr{break-inside:avoid}
  .paper h2{break-after:avoid}
}

@media (max-width:600px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .monthnav h1{font-size:1.3rem}
  .kpi{padding:10px}
  .kpi b{font-size:1.05rem}
  .addform{grid-template-columns:repeat(2,minmax(0,1fr))}
  .addform > .field{grid-column:span 2}
  .addform > .field.half{grid-column:span 1}
  .row{grid-template-columns:minmax(0,1fr) 7rem}
  .row.w3{grid-template-columns:minmax(0,1fr) 7rem}
  .row.w3 > :last-child{grid-column:1/-1}
  .srow{grid-template-columns:minmax(0,1fr) 6rem auto}
  .cathead,.subrow{grid-template-columns:minmax(0,1fr) 5.2rem 5.2rem auto}
  .defgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .defgrid > .s6,.defgrid > .wide{grid-column:1/-1}
  .erow{grid-template-columns:3.2rem minmax(0,1fr) auto;gap:6px}
  .erow .acts{grid-column:2/-1;justify-content:flex-end;margin-top:-6px}
  .paper{padding:20px 16px}
  .paper .sum{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <form class="loginbox" id="loginform" autocomplete="on">
    <h1>Mein Monatsbudget</h1>
    <p class="hint">Melde dich an, damit deine Daten auf Handy und Laptop gleich sind.</p>
    <button type="button" class="secondary" id="google">Mit Google anmelden</button>
    <div class="or">oder mit E-Mail</div>
    <div class="field"><label for="l-mail">E-Mail</label><input id="l-mail" type="email" autocomplete="email" required></div>
    <div class="field"><label for="l-pw">Passwort</label><input id="l-pw" type="password" autocomplete="current-password" minlength="6" required></div>
    <p class="err" id="l-err" hidden></p>
    <button class="primary" type="submit" id="l-submit">Anmelden</button>
    <div class="btnrow" style="justify-content:space-between">
      <button type="button" class="linkbtn" id="l-toggle">Neues Konto erstellen</button>
      <button type="button" class="linkbtn" id="l-reset">Passwort vergessen?</button>
    </div>
  </form>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="headrow">
      <div class="brand">Mein Monatsbudget</div>
      <div class="monthnav">
        <button class="iconbtn" id="prev" aria-label="Vorheriger Monat">‹</button>
        <h1 id="mlabel">&nbsp;</h1>
        <button class="iconbtn" id="next" aria-label="Nächster Monat">›</button>
        <button class="todaybtn" id="today">Heute</button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="uebersicht">Übersicht</button>
      <button role="tab" data-tab="ausgaben">Ausgaben</button>
      <button role="tab" data-tab="einnahmen">Einnahmen</button>
      <button role="tab" data-tab="konten">Konten</button>
      <button role="tab" data-tab="schulden">Schulden</button>
      <button role="tab" data-tab="sparen">Sparziele</button>
      <button role="tab" data-tab="wiederkehrend">Wiederkehrend</button>
      <button role="tab" data-tab="monat">Monat</button>
      <button role="tab" data-tab="berichte">Berichte</button>
      <button role="tab" data-tab="setup">Setup</button>
    </nav>
  </header>
  <div class="notice" id="notice" hidden></div>
  <main id="main"></main>

function migrateAll(sIn, msIn){

    for(const k of Object.keys(ms)){
      const m = ms[k]; if((m.v||0)>=3) continue;
      const past = k < nowKey;
      const out = {v:3, plan:{}, incomePlan:{}, goals:m.goals||{}, tx:[], actual:{}};
      (m.entries||[]).forEach(e=>out.tx.push({id:e.id||newId('t'),t:e.t||0,type:'expense',amount:e.amount||0,date:e.date||k+'-01',account:'giro',cat:e.cat,sub:e.sub||'',note:e.note||'',personId:''}));

  const debtPlanOpen = sum(plan.filter(p=>!p.paid && p.r.kind==='schulden'), p=>p.amount);
  const repaid = sum(tx.filter(t=>t.type==='debt_repay'), t=>t.amount);
  const variable = sum(tx.filter(t=>t.type==='expense' && !t.rid), t=>t.amount);
  const paidFor = sum(tx.filter(t=>t.type==='expense' && t.personId), t=>t.amount);
  const credits = sum(tx.filter(t=>t.type==='debt_credit'), t=>t.amount);
  const loans = sum(tx.filter(t=>t.type==='debt_in'), t=>t.amount);
  const byCat = {};
  tx.filter(t=>t.type==='expense' && !t.rid).forEach(t=>{ const c=t.cat||'_none'; byCat[c] = r2((byCat[c]||0)+t.amount); });
  const byKind = {};
  plan.forEach(p=>{ if(p.r.kind==='schulden') return; const v = p.paid ? p.tx.amount : p.amount; byKind[p.r.kind] = r2((byKind[p.r.kind]||0)+v); });
  tx.filter(t=>t.type==='expense' && t.rid && !plan.find(p=>p.r.id===t.rid)).forEach(t=>{ byKind.sonst = r2((byKind.sonst||0)+t.amount); });
  const goalsPlanned = sum(S.goals, g=>goalVal(key,g).amount);
  const goalsDone = sum(S.goals.filter(g=>goalVal(key,g).done), g=>goalVal(key,g).amount);
  /* Bankkonto-Logik: Einnahmen und Ausgaben zählen erst, wenn sie tatsächlich gebucht sind.
     Geplante (noch offene) Beträge stehen getrennt und werden nie zum verfügbaren Geld addiert. */
  const income = incomeActual;                               // tatsächlich eingegangen
  const out = r2(fixedPaid + variable + repaid);             // tatsächlich bezahlt
  const outOpen = r2(fixedOpen + debtPlanOpen);              // noch offen geplant
  const goalsOpen = sum(S.goals.filter(g=>!goalVal(key,g).done), g=>goalVal(key,g).amount);
  const sres = savingsReserve(key);
  const bal = balances(key);
  const opening = bal.openingTotal, available = bal.total;   // Startguthaben / verfügbar (= Kontostand)
  return {incomeActual, incomeOpen, income, fixedPaid, fixedOpen, debtPlanOpen, repaid, variable, paidFor, credits, loans,
    byCat, byKind, goalsPlanned, goalsDone, goalsOpen, out, outOpen, left: r2(income - out),
    opening, available, savingsReserved: sres.total, forecast: r2(available - outOpen - sres.total), openingSet: bal.anyOpening,
    fixed: r2(fixedPaid+fixedOpen), actualOut: out};
}

/* Kontostände */
function accountFlows(key){
  const f = {}; S.accounts.forEach(a=>f[a.id]={in:0,out:0});
  for(const t of txsOf(key)){
    const add=(id,k,v)=>{ if(f[id]) f[id][k]=r2(f[id][k]+v); };
    if(t.type==='income' || (t.type==='debt_in' && t.account)) add(t.account,'in',t.amount);
    else if(t.type==='expense' || t.type==='debt_repay') add(t.account,'out',t.amount);
    else if(t.type==='transfer'){ add(t.account,'out',t.amount); add(t.to,'in',t.amount); }
  }
  return f;
}
/* Startguthaben eines Monats: manuell eingetragen ODER automatisch = Endsaldo des Vormonats
   (nur ab dem Startmonat der Budgetverwaltung). Das Startguthaben ist KEINE Einnahme. */
let balCache = new Map();
const invalidate = () => { balCache = new Map(); };
function openingOf(key, accId, depth=0){
  const ck = key+'|'+accId; if(balCache.has(ck)) return balCache.get(ck);
  const o = months[key]?.opening?.[accId];
  let res;
  if(o!=null) res = {v:o, src:'manual', set:true};
  else {
    const prev = shiftMonth(key,-1);
    if(depth<600 && managed(prev) && managed(key)){ const po = openingOf(prev, accId, depth+1); const f = accountFlows(prev)[accId]||{in:0,out:0}; res = {v:r2(po.v + f.in - f.out), src:'auto', set:po.set}; }
    else res = {v:0, src:'none', set:false};
  }
  balCache.set(ck, res); return res;
}
function balances(key){
  const m = months[key]||{}; const f = accountFlows(key);
  const rows = S.accounts.map(a=>{
    const op = openingOf(key, a.id);
    const calc = r2(op.v + f[a.id].in - f[a.id].out);
    const act = m.actual?.[a.id];
    return {a, opening: op.v, openingSrc: op.src, openingManual: m.opening?.[a.id], openingSet: op.set, in:f[a.id].in, out:f[a.id].out, calc, actual: act ? act.amount : null, actualAt: act?.at||'', diff: act ? r2(act.amount - calc) : 0};
  });
  return {rows, total: sum(rows, r=>r.calc), openingTotal: sum(rows, r=>r.opening), anyOpening: rows.some(r=>r.openingSet), allOpening: rows.every(r=>r.openingSet || (!r.in && !r.out)), auto: rows.some(r=>r.openingSrc==='auto')};
}

/* Schulden pro Person – immer aus den einzelnen Buchungen berechnet */
function personTx(pid){
  return allTx().filter(t=>t.personId===pid && ['debt_in','debt_repay','debt_credit','expense'].includes(t.type)).sort(byDate);
}
const debtEffect = t => t.type==='debt_in' ? t.amount : -t.amount;
function personSummary(pid, txs){
  txs = txs || personTx(pid);
  const ins = txs.filter(t=>t.type==='debt_in');
  const original = ins.length ? ins[0].amount : 0;
  const received = sum(ins, t=>t.amount);
  const repaid = sum(txs.filter(t=>t.type==='debt_repay'), t=>t.amount);
  const paidFor = sum(txs.filter(t=>t.type==='expense'), t=>t.amount);
  const credits = sum(txs.filter(t=>t.type==='debt_credit'), t=>t.amount);
  const settled = r2(repaid + paidFor + credits);
  const open = r2(received - settled);
  const status = !txs.length ? 'leer' : Math.abs(open)<0.005 ? 'ausgeglichen' : open<0 ? 'ueberzahlt' : 'offen';
  return {original, additional: r2(received-original), received, repaid, paidFor, credits, settled, open, status, count: txs.length};
}
function debtTypeLabel(t){ return t.type==='expense' ? 'Für Person bezahlt' : t.type==='debt_credit' ? 'Sonstiger Ausgleich' : TXLABEL[t.type]; }
function debtDesc(t){ return t.type==='expense' ? `${t.note || 'Einkauf'}` : (t.note || TXLABEL[t.type]); }
function linkedInfo(t){
  if(t.type==='expense') return `Ausgabe: ${catName(t.cat)}${t.sub?' › '+t.sub:''} · ${accName(t.account)}`;
  if(t.rid) return `Rate: ${(S.recurring.find(r=>r.id===t.rid)||{}).name||'wiederkehrend'} · ${accName(t.account)}`;
  if(t.type==='debt_repay' || (t.type==='debt_in' && t.account)) return accName(t.account);
  return '';
}
const settledIn = key => sum(txsOf(key).filter(t=>t.personId && ['debt_repay','debt_credit','expense'].includes(t.type)), t=>t.amount);
function statusChip(s){
  return s==='ausgeglichen' ? '<span class="chip good">✓ vollständig bezahlt</span>' : s==='ueberzahlt' ? '<span class="chip warn">Überzahlt</span>' : s==='offen' ? '<span class="chip bad">offen</span>' : '<span class="chip">keine Buchungen</span>';
}

/* Wochen (Montag bis Sonntag, innerhalb des Monats) */
/* Wochen (Montag bis Sonntag) innerhalb des Monats bzw. Gehaltsmonats – als echte Datumsangaben */
function weeksOf(key){
  const weeks=[]; let w=null; const end = periodEnd(key);
  for(let d = periodStart(key); d <= end; d = addDays(d,1)){ const wd = new Date(d+'T00:00:00Z').getUTCDay(); if(!w || wd===1){ w={from:d,to:d}; weeks.push(w); } else w.to=d; }
  return weeks;
}
function weekSpent(key, w, catId, sub){
  return sum(txsOf(key).filter(t=>{ if(t.type!=='expense'||t.rid||t.cat!==catId) return false; if(sub!==undefined && t.sub!==sub) return false; return (t.date||'') >= w.from && (t.date||'') <= w.to; }), t=>t.amount);
}
function weeklyBudgets(){
  const out=[];
  S.cats.forEach(c=>{ if(c.weekly>0) out.push({label:c.name, catId:c.id, sub:undefined, limit:c.weekly});
    Object.entries(c.subWeekly||{}).forEach(([s,v])=>{ if(v>0 && c.subs.includes(s)) out.push({label:`${c.name} › ${s}`, catId:c.id, sub:s, limit:v}); }); });
  return out;
}
function monthlyBudgets(key){
  const out=[];
  S.cats.forEach(c=>{ if(c.limit>0) out.push({label:c.name, catId:c.id, sub:undefined, limit:c.limit, spent:catSpent(key,c.id)});
    Object.entries(c.subLimits||{}).forEach(([s,v])=>{ if(v>0 && c.subs.includes(s)) out.push({label:`${c.name} › ${s}`, catId:c.id, sub:s, limit:v, spent:catSpent(key,c.id,s)}); }); });
  out.forEach(b=>{ b.left = r2(b.limit-b.spent); b.pct = b.limit ? b.spent/b.limit : 0; });
  return out;
}
/* Reserviert für Kategorie-Budgets: Unterpunkt-Budgets sind in der Kategorie enthalten, wenn diese ein eigenes Budget hat */
function budgetReserve(key){
  let res = 0;
  S.cats.forEach(c=>{
    if(c.limit>0) res += Math.max(0, c.limit - catSpent(key,c.id));
    else Object.entries(c.subLimits||{}).forEach(([s,v])=>{ if(v>0 && c.subs.includes(s)) res += Math.max(0, v - catSpent(key,c.id,s)); });
  });
  return r2(res);
}
/* Bestätigung vor dem Umstellen – zeigt genau, was passiert */
let msPending = null;
function msConfirm(){
  const P = +S.payday||26;
  if(msPending==='payday'){
    const t = todayStr(), k = t.slice(0,7); let since = +t.slice(8,10) >= Math.min(P, daysIn(k)) ? shiftMonth(k,1) : k;
    if(isClosed(shiftMonth(since,-1))) since = shiftMonth(since,1);
    const prev = shiftMonth(since,-1), from = `${prev}-${pad(Math.min(P, daysIn(prev)))}`;
    const n = allTx().filter(x=>x._m===prev && x.date >= from && !isClosed(prev)).length;
    if(P < 2) return `<div class="warnrow"><i>⚠</i><div>Dein Gehaltstag ist der 1. – das ist schon der Kalendermonat. Trage oben einen anderen Gehaltstag ein.</div></div>`;
    return `<div class="warnrow info" id="ms-confirm"><i>ℹ</i><div><b>Auf Gehaltsmonat umstellen?</b><br>
      Ab ${esc(monthName(since))} läuft jeder Monat vom ${P}. bis zum ${P-1}. des Folgemonats – z. B. ${esc(monthOnly(since))} = ${fmtDay(from)}–${fmtDay(addDays(`${since}-${pad(Math.min(P, daysIn(since)))}`,-1))}.
      ${esc(monthOnly(prev))} endet dafür am ${fmtDay(addDays(from,-1))}. ${n ? `${n} Buchung${n===1?'':'en'} vom ${fmtDay(from)} an wandern in den ${esc(monthOnly(since))}.` : ''}
      Frühere Monate bleiben, wie sie sind. Vorher wird automatisch eine Sicherung angelegt; du kannst jederzeit zurückstellen.
      <div class="btnrow" style="margin-top:8px"><button class="btn primary" data-act="msYes">Umstellen</button><button class="btn" data-act="msNo">Abbrechen</button></div></div></div>`;
  }
  return `<div class="warnrow info" id="ms-confirm"><i>ℹ</i><div><b>Zurück auf Kalendermonat (1. bis Monatsende)?</b><br>Buchungen werden wieder nach Kalendermonat zugeordnet. Vorher wird automatisch eine Sicherung angelegt.
    <div class="btnrow" style="margin-top:8px"><button class="btn primary" data-act="msYes">Umstellen</button><button class="btn" data-act="msNo">Abbrechen</button></div></div></div>`;
}
function daysToPayday(){
  const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const P = S.payday||26; const dThis = Math.min(P, daysIn(monthKey(today)));
  let next;
  if(today.getDate() < dThis) next = new Date(today.getFullYear(), today.getMonth(), dThis);
  else { const nm = new Date(today.getFullYear(), today.getMonth()+1, 1); next = new Date(nm.getFullYear(), nm.getMonth(), Math.min(P, daysIn(monthKey(nm)))); }
  return Math.max(1, Math.round((next - today)/86400000));
}

/* „Wie viel kann ich heute ausgeben?“ – nachvollziehbare Rechnung */
function spendToday(){
  const key = nowKey();
  const bal = balances(key);
  let plan = planItems(key).filter(p=>!p.skip && !p.paid);            // nur noch NICHT bezahlte Zahlungen
  // Kalendermonat + „bis Gehaltstag“: Zahlungen des nächsten Monats, die VOR dem nächsten Gehalt fällig sind (z. B. Miete am 1.), auch abziehen
  if(!payMode() && S.horizon==='payday'){
    const nextPay = addDays(todayStr(), daysToPayday()), nk = shiftMonth(key,1);
    if(nextPay.slice(0,7) === nk) plan = plan.concat(planItems(nk).filter(p=>!p.skip && !p.paid && p.due < nextPay));
  }
  const openFixed = sum(plan.filter(p=>p.r.kind!=='schulden'), p=>p.amount);
  const openDebt = sum(plan.filter(p=>p.r.kind==='schulden'), p=>p.amount);
  const sres = savingsReserve(key);
  const openGoals = sres.total;
  const reserve = budgetReserve(key);                                    // nur der REST der Budgets (Budget − schon ausgegeben)
  const expected = sum(incomeItems(key).filter(i=>!i.skip && !i.received), i=>i.amount);
  const free = r2(bal.total - openFixed - openDebt - openGoals - reserve);
  const d = new Date();
  const days = payMode() ? Math.max(1, daysBetween(todayStr(), periodEnd(key)) + 1) : S.horizon==='payday' ? daysToPayday() : daysIn(key) - d.getDate() + 1;
  const lines = [
    ['Kontostand aktuell (Girokonto + Bargeld, alle echten Buchungen)', bal.total],
    ['− noch offene feste Zahlungen (noch nicht bezahlt)', -openFixed],
    ['− offene Schuldenzahlungen (geplante Raten, noch nicht bezahlt)', -openDebt],
    ['− für Sparziele reserviert (bleibt auf dem Konto)', -openGoals],
    ['− noch reserviertes Kategorie-Budget (Budget − schon ausgegeben)', -reserve]
  ];
  return {key, total:bal.total, openFixed, openDebt, openGoals, savingsDone:sres.done, savingsOpen:sres.open, reserve, expected, free, days, perDay: r2(free/days), lines, openingMissing: !bal.anyOpening};
}

/* Warnungen – nur Hinweise, ändern keine Daten */
function warnings(key){
  const w = [];
  const isNow = key===nowKey();
  const bal = balances(key);
  const hasTx = txsOf(key).length>0;
  if(!managed(key)) return w;
  if(hasTx && !bal.anyOpening) w.push(['info', `Für ${monthName(key)} ist noch kein Startsaldo eingetragen. Kontostände sind deshalb nicht genau.`, 'konten']);
  monthlyBudgets(key).forEach(b=>{
    if(b.pct>1) w.push(['bad', `Budget „${b.label}“ überschritten: ${fmt(b.spent)} von ${fmt(b.limit)}.`]);
    else if(b.pct>=.8) w.push(['warn', `Budget „${b.label}“ zu ${Math.round(b.pct*100)} % verbraucht (noch ${fmt(b.left)}).`]);
  });
  if(isNow){
    const today = todayStr();
    const wk = weeksOf(key).find(x=>today>=x.from && today<=x.to);
    weeklyBudgets().forEach(b=>{ const s=weekSpent(key,wk,b.catId,b.sub); if(s>b.limit) w.push(['warn', `Wochenbudget „${b.label}“ überschritten: ${fmt(s)} von ${fmt(b.limit)}.`]); });
    upcoming(10).forEach(u=>{
      const n = daysBetween(todayStr(), u.due);
      if(n<0) w.push(['bad', `${u.name} (${fmt(u.amount)}) ist seit ${-n} ${-n===1?'Tag':'Tagen'} überfällig.`, 'wiederkehrend']);
      else if(n<=3) w.push(['warn', `${u.name} (${fmt(u.amount)}) ist ${n===0?'heute':n===1?'morgen':`in ${n} Tagen`} fällig.`, 'wiederkehrend']);
    });
    const st = spendToday();
    if(bal.anyOpening && bal.total - st.openFixed - st.openDebt < 0) w.push(['bad', `Der Kontostand (${fmt(bal.total)}) reicht möglicherweise nicht für alle offenen Zahlungen (${fmt(st.openFixed+st.openDebt)}).`]);
  }
  planItems(key).filter(p=>!p.skip && !p.paid && p.r.kind==='schulden' && p.amount>0).forEach(p=>w.push(['warn', `Schuldenzahlung „${p.r.name}“ (${fmt(p.amount)}) ist diesen Monat noch offen.`, 'wiederkehrend']));
  bal.rows.forEach(r=>{ if(r.actual!=null && key < nowKey() && !actualAtEnd(key, r.actualAt)) w.push(['info', `${r.a.name}: Der tatsächliche Kontostand ist vom ${fmtDate(r.actualAt)}, nicht vom letzten Tag des Monats (${fmtDate(monthLastDay(key))}).`, 'konten']); });
  bal.rows.forEach(r=>{ if(r.actual!=null && Math.abs(r.diff)>=0.01) w.push(['warn', `${r.a.name}: Tatsächlicher Kontostand weicht um ${fmtS(r.diff)} vom berechneten ab. Fehlt eine Buchung?`, 'konten']); });
  return w;
}
/* Nächste Zahlungen (aktueller + nächster Monat) */
function upcoming(limitDays=31){
  const k1 = nowKey(), k2 = shiftMonth(k1,1), t = todayStr();
  const out = [];
  [k1,k2].forEach(k=>planItems(k).forEach(p=>{ if(p.paid||p.skip||!(p.amount>0)) return; const n=daysBetween(t,p.due); if(n<=limitDays) out.push({name:p.r.name, amount:p.amount, due:p.due, kind:p.r.kind, key:k, rid:p.r.id}); }));
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}

/* =====================================================================
   SPEICHERN
   ===================================================================== */
function materialize(key){
  const m = normalizeMonth(clone(months[key]||{}));
  if(!managed(key)) return m;   // vor dem Startmonat: keine Standardwerte anlegen
  S.recurring.filter(r=>occurs(r,key)).forEach(r=>{ if(!m.plan[r.id]) m.plan[r.id]={amount:r.amount||0}; else if(m.plan[r.id].amount==null) m.plan[r.id].amount=r.amount||0; });
  S.incomes.filter(i=>i.active!==false).forEach(i=>{ if(!m.incomePlan[i.id]) m.incomePlan[i.id]={amount:i.amount||0}; else if(m.incomePlan[i.id].amount==null) m.incomePlan[i.id].amount=i.amount||0; });
  S.goals.forEach(g=>{ if(!m.goals[g.id]) m.goals[g.id]=goalVal(key,g); });
  return m;
}
function saveLocal(){
  const data = JSON.stringify({S,months});
  try{ localStorage.setItem('budget-v3', data); }
  catch(e){
    // Speicher voll: ältere automatische Sicherungen entfernen und erneut versuchen – die echten Daten haben Vorrang
    try{ const ab = JSON.parse(localStorage.getItem('budget-autobackups')||'[]'); localStorage.setItem('budget-autobackups', JSON.stringify(ab.slice(0,1))); localStorage.setItem('budget-v3', data); return; }catch(_){}
    try{ localStorage.removeItem('budget-autobackups'); localStorage.setItem('budget-v3', data); return; }catch(_){}
    toast('Speichern im Browser ist nicht möglich (Speicher voll). Lade eine Sicherung herunter.');
  }
}
function cloudErr(){ toast('Speichern in der Cloud hat nicht geklappt. Prüfe deine Internetverbindung.'); }
function persistSettings(){
  if(mode==='cloud') F.setDoc(F.doc(fdb,'users',user.uid,'data','settings'), clone(S)).catch(cloudErr);
  saveLocal();
}
function persistMonth(key){
  if(mode==='cloud') F.setDoc(F.doc(fdb,'users',user.uid,'months',key), clone(months[key])).catch(cloudErr);
  saveLocal();
}
function lockedMsg(key){ toast(`${monthName(key)} ist abgeschlossen. Unter „Monat“ kannst du ihn wieder öffnen.`); }
function editMonth(key, fn, save=true){
  invalidate();
  if(isClosed(key)){ lockedMsg(key); return false; }
  const m = materialize(key); fn(m); months[key] = m;
  if(save) persistMonth(key);
  return true;
}
function editSettings(fn, save=true){ invalidate(); fn(S); if(save) persistSettings(); }
function findTx(id){ for(const k in months){ const t = txsOf(k).find(x=>x.id===id); if(t) return {key:k, t}; } return null; }
function addTx(t){
  t.id = t.id || newId('t'); t.t = t.t || Date.now();
  const key = bucketOf(t.date||todayStr());
  return editMonth(key, m=>m.tx.push(t)) ? t : null;
}
function removeTx(id){
  const f = findTx(id); if(!f) return false;
  return editMonth(f.key, m=>{ m.tx = m.tx.filter(x=>x.id!==id); });
}
function updateTx(id, nt){
  const f = findTx(id); if(!f) return false;
  const newKey = nt.date === f.t.date ? f.key : bucketOf(nt.date);   // Datum unverändert → bleibt im bisherigen Monat
  if(isClosed(f.key)){ lockedMsg(f.key); return false; }
  if(newKey===f.key) return editMonth(f.key, m=>{
    const i=m.tx.findIndex(x=>x.id===id); if(i>=0) m.tx[i]=nt;
    // Einnahme einer anderen Quelle zugeordnet: Verknüpfung umhängen
    if(f.t.type==='income' && (f.t.incId||'')!==(nt.incId||'')){
      if(f.t.incId && m.incomePlan?.[f.t.incId]?.tx===id) delete m.incomePlan[f.t.incId].tx;
      if(nt.incId){ const open = !m.incomePlan?.[nt.incId]?.tx || !m.tx.some(x=>x.id===m.incomePlan[nt.incId].tx); if(open) m.incomePlan[nt.incId] = {...(m.incomePlan[nt.incId]||{amount:nt.amount}), tx:id}; }
    }
  });
  if(isClosed(newKey)){ lockedMsg(newKey); return false; }
  // Verknüpfung zu geplanter Zahlung/Einnahme im alten Monat lösen …
  editMonth(f.key, m=>{ m.tx = m.tx.filter(x=>x.id!==id);
    if(nt.rid && m.plan?.[nt.rid]?.paidTx===id) delete m.plan[nt.rid].paidTx;
    if(nt.incId && m.incomePlan?.[nt.incId]?.tx===id) delete m.incomePlan[nt.incId].tx; });
  // … und im neuen Monat nur verknüpfen, wenn die Zahlung dort geplant und noch offen ist
  let relinked = false;
  if(nt.rid){ const it = planItems(newKey).find(p=>p.r.id===nt.rid && !p.paid); if(it) relinked = true; else if(nt.type==='expense'){ delete nt.rid; } else { delete nt.rid; } }
  if(nt.incId){ const it = incomeItems(newKey).find(x=>x.i.id===nt.incId && !x.received); if(!it) nt.incIdOnly = true; }
  editMonth(newKey, m=>m.tx.push(nt));
  if(relinked) linkPlan(newKey, nt.rid, nt.id);
  if(nt.incId && !nt.incIdOnly){ editMonth(newKey, m=>{ m.incomePlan[nt.incId] = {...(m.incomePlan[nt.incId]||{}), tx:nt.id}; }); }
  delete nt.incIdOnly;
  toast(`Buchung nach ${monthName(newKey)} verschoben.`);
  return true;
}

/* ---------- Monatsgrenze ändern (Gehaltsmonat an/aus, anderer Gehaltstag) ----------
   1) Vorher merken, zu welchem fälligen Posten (Datum!) eine verknüpfte Buchung gehört.
   2) Einstellung ändern.
   3) Jede Buchung ins passende Fach legen: unverknüpfte nach ihrem Datum, verknüpfte nach dem Datum ihres Postens
      (z. B. Gehalt vom 26.10. → November; eine am 28.10. bezahlte Oktober-Miete bleibt im Oktober).
   Abgeschlossene Monate werden nie verändert. Vorher wird automatisch gesichert. */
function linkedDues(){
  const out = {};
  for(const k of Object.keys(months)){
    const m = months[k]; const ids = new Set((m.tx||[]).map(t=>t.id));
    for(const [rid,p] of Object.entries(m.plan||{})){ const r = S.recurring.find(x=>x.id===rid); if(p && p.paidTx && ids.has(p.paidTx)) out[p.paidTx] = {kind:'plan', id:rid, due: itemDate(k, r ? r.dueDay : 1), amount:p.amount}; }
    for(const [iid,p] of Object.entries(m.incomePlan||{})){ const i = S.incomes.find(x=>x.id===iid); if(p && p.tx && ids.has(p.tx)) out[p.tx] = {kind:'income', id:iid, due: itemDate(k, i ? (i.day||S.payday) : S.payday), amount:p.amount}; }
  }
  return out;
}
function changeMonthRule(fn, reason){
  autoBackup(reason || 'vor Änderung der Monatsgrenze');
  const dues = linkedDues();
  editSettings(fn);
  invalidate();
  const moves = [];
  for(const k of Object.keys(months).sort()){
    if(isClosed(k)) continue;
    for(const t of txsOf(k)){
      const link = dues[t.id];
      const nk = bucketOf(link ? link.due : t.date);
      if(nk !== k && !isClosed(nk)) moves.push({t, from:k, to:nk, link});
    }
  }
  const touched = new Set();
  for(const mv of moves){
    const {t, from, to, link} = mv;
    const fm = months[from];
    fm.tx = fm.tx.filter(x=>x.id!==t.id);
    if(link && link.kind==='plan' && fm.plan?.[link.id]?.paidTx===t.id) delete fm.plan[link.id].paidTx;
    if(link && link.kind==='income' && fm.incomePlan?.[link.id]?.tx===t.id) delete fm.incomePlan[link.id].tx;
    const tm = months[to] = materialize(to);
    tm.tx.push(t);
    if(link){
      const field = link.kind==='plan' ? 'plan' : 'incomePlan', ref = link.kind==='plan' ? 'paidTx' : 'tx';
      const cur0 = tm[field][link.id];
      const taken = cur0 && cur0[ref] && tm.tx.some(x=>x.id===cur0[ref]);
      if(!taken) tm[field][link.id] = {...(cur0||{}), amount: link.amount ?? cur0?.amount ?? t.amount, [ref]: t.id, skip:false};
    }
    touched.add(from); touched.add(to);
  }
  invalidate();
  touched.forEach(k=>persistMonth(k));
  persistSettings();
  return moves.length;
}
function startPayMonths(){
  const P = Math.min(Math.max(2, +S.payday||26), 31);
  const t = todayStr(), k = t.slice(0,7);
  let since = +t.slice(8,10) >= Math.min(P, daysIn(k)) ? shiftMonth(k,1) : k;   // der Gehaltsmonat, in dem du gerade bist
  if(isClosed(shiftMonth(since,-1))) since = shiftMonth(since,1);               // abgeschlossene Monate bleiben unverändert
  return changeMonthRule(s=>{ s.monthStart='payday'; s.periodSince=since; }, 'vor Umstellung auf Gehaltsmonat');
}
function stopPayMonths(){ return changeMonthRule(s=>{ s.monthStart='calendar'; s.periodSince=''; }, 'vor Umstellung auf Kalendermonat'); }

/* Automatische Sicherungen (einmal pro Tag, die letzten 7) */
function autoBackup(reason){
  try{
    const list = JSON.parse(localStorage.getItem('budget-autobackups')||'[]');
    const d = todayStr();
    if(!reason && list.length && list[0].at.slice(0,10)===d) return;
    list.unshift({at:new Date().toISOString(), reason:reason||'täglich', data:{S,months}});
    localStorage.setItem('budget-autobackups', JSON.stringify(list.slice(0,7)));
  }catch(e){}
}
function autoBackups(){ try{ return JSON.parse(localStorage.getItem('budget-autobackups')||'[]'); }catch(e){ return []; } }

function filteredTx(){
  const q = flt.q.trim().toLowerCase();
  const min = flt.min ? parseAmt(flt.min) : null, max = flt.max ? parseAmt(flt.max) : null;
  return allTx().filter(t=>{
    if(flt.scope==='month' && t._m!==cur) return false;
    if(flt.scope==='pick' && t._m!==(flt.month||cur)) return false;
    if(flt.type==='expense' && t.type!=='expense') return false;
    if(flt.type==='income' && t.type!=='income') return false;
    if(flt.type==='debt' && !(t.personId)) return false;
    if(flt.from && t.date < flt.from) return false;
    if(flt.to && t.date > flt.to) return false;
    if(flt.cat && t.cat!==flt.cat) return false;
    if(flt.sub && t.sub!==flt.sub) return false;
    if(min!=null && t.amount < min) return false;
    if(max!=null && t.amount > max) return false;
    if(flt.person && t.personId!==flt.person) return false;
    if(flt.account && t.account!==flt.account && t.to!==flt.account) return false;
    if(q){
      const hay = [t.note, t.sub, t.cat?catName(t.cat):'', t.personId?personName(t.personId):'', t.account?accName(t.account):'', t.rid?(S.recurring.find(r=>r.id===t.rid)||{}).name:'', TXLABEL[t.type], String(t.amount).replace('.',',')].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>byDate(b,a));
}

/* ---------- Schulden ---------- */
VIEWS.schulden = function(){
  if(selPerson && S.people.find(p=>p.id===selPerson)) return viewPerson(selPerson);
  selPerson = null;
  const dm = debtMonth || cur;
  const ppl = S.people.map(p=>({p, s:personSummary(p.id)}));
  const totalOpen = sum(ppl, x=>Math.max(0,x.s.open));
  const mt = txsOf(dm);
  const monthRows = ppl.map(x=>{
    const t = mt.filter(tt=>tt.personId===x.p.id);
    const settled = sum(t.filter(tt=>tt.type!=='debt_in'), tt=>tt.amount);
    const got = sum(t.filter(tt=>tt.type==='debt_in'), tt=>tt.amount);
    return {x, settled, got, repaid: sum(t.filter(tt=>tt.type==='debt_repay'),tt=>tt.amount), paidFor: sum(t.filter(tt=>tt.type==='expense'),tt=>tt.amount), credits: sum(t.filter(tt=>tt.type==='debt_credit'),tt=>tt.amount)};
  }).filter(r=>r.settled||r.got);

      <div class="stat"><span>${esc(monthOnly(cur))}: zurückgezahlt</span><b>${fmt(sum(txsOf(cur).filter(t=>t.type==='debt_repay'),t=>t.amount))}</b></div>
      <div class="stat"><span>${esc(monthOnly(cur))}: für andere bezahlt</span><b>${fmt(sum(txsOf(cur).filter(t=>t.type==='expense'&&t.personId),t=>t.amount))}</b></div>
      <div class="stat"><span>${esc(monthOnly(cur))}: ausgeglichen</span><b>${fmt(settledIn(cur))}</b></div>
    </div>
    <div class="panel">${ppl.length ? ppl.map(x=>{
      const pct = x.s.received ? Math.min(100, x.s.settled/x.s.received*100) : 0;
      return `<div class="card"><div class="top2"><button class="linkbtn" style="font-size:1rem" data-act="person" data-id="${esc(x.p.id)}">${esc(x.p.name)} ›</button><span class="num">${x.s.status==='ausgeglichen'?'':'offen '}<b>${fmt(x.s.open)}</b> ${statusChip(x.s.status)}</span></div>
        ${x.s.received?`<div class="track"><div class="fill good" style="width:${pct.toFixed(1)}%"></div></div><span class="hint">erhalten ${fmt(x.s.received)} · ausgeglichen ${fmt(x.s.settled)} (Rückzahlungen ${fmt(x.s.repaid)}, für die Person bezahlt ${fmt(x.s.paidFor)}${x.s.credits?`, Gutschriften ${fmt(x.s.credits)}`:''})</span>`:''}</div>`; }).join('') : '<div class="empty">Noch keine Personen. Lege unten eine Person an und buche dann, was sie dir gegeben hat.</div>'}</div>
    <form class="addform" id="personform" autocomplete="off">
      <div class="field s4"><label for="p-name">Neue Person</label><input id="p-name" type="text" placeholder="Name"></div>
      <div class="field s2 fbtn"><button class="primary" type="submit">Person anlegen</button></div>
    </form></section>
  <section><div class="sechead"><h2>Schulden nach Monat</h2><input type="month" id="dm" value="${esc(dm)}" style="max-width:11rem" data-act2="debtMonth" aria-label="Monat wählen"></div>
    <div class="panel tbl-wrap"><table><thead><tr><th class="l">Person</th><th>Erhalten</th><th>Zurückgezahlt</th><th>Für Person bezahlt</th><th>Sonstiger Ausgleich</th><th>Ausgeglichen</th></tr></thead><tbody>
      ${monthRows.map(r=>`<tr><td class="l">${esc(r.x.p.name)}</td><td>${fmt(r.got)}</td><td>${fmt(r.repaid)}</td><td>${fmt(r.paidFor)}</td><td>${fmt(r.credits)}</td><td><b>${fmt(r.settled)}</b></td></tr>`).join('') || `<tr><td class="l" colspan="6">Keine Schulden-Buchungen im ${esc(monthName(dm))}.</td></tr>`}

    </tbody></table></div></section>`;
};
let debtType = 'debt_repay';
let personMonth = '';

      <div class="stat"><span>Zurückgezahlt</span><b>${fmt(s.repaid)}</b></div>
      <div class="stat"><span>Für Person bezahlt</span><b>${fmt(s.paidFor)}</b></div>
      <div class="stat"><span>Sonstiger Ausgleich</span><b>${fmt(s.credits)}</b></div>
      <div class="stat"><span>Gesamt ausgeglichen</span><b>${fmt(s.settled)}</b></div>
      <div class="stat hl"><span>Noch offen</span><b>${fmt(s.open)}</b></div>
    </div>
    ${s.status==='ueberzahlt'?`<div class="warnrow"><i>⚠</i><div>Du hast ${fmt(-s.open)} mehr ausgeglichen als erhalten. ${esc(p.name)} schuldet dir diesen Betrag.</div></div>`:''}
  </section>
  <section><div class="sechead"><h2>Neue Buchung</h2>${s.open>0?`<button class="secondary" style="white-space:normal;text-align:left" data-act="settleAll">Schuld vollständig ausgleichen (${fmt(s.open)})</button>`:''}</div>
    <form class="addform" id="debtform" autocomplete="off">
      <div class="field s3"><label for="d-type">Art</label><select id="d-type">${opt('debt_in','Geld erhalten (Schuld steigt)',debtType)}${opt('debt_repay','Rückzahlung (ich zahle zurück)',debtType)}${opt('expense','Für die Person bezahlt',debtType)}${opt('debt_credit','Gutschrift / sonstiger Ausgleich (ohne Geldfluss)',debtType)}</select></div>
      <div class="field s3 half"><label for="d-amt">Betrag (€)</label><input id="d-amt" class="amt" type="text" inputmode="decimal" placeholder="0,00"></div>
      <div class="field s2 half"><label for="d-date">Datum</label><input id="d-date" type="date" value="${todayStr()}"></div>
      <div class="field s2" id="d-accwrap"><label for="d-acc">Konto</label><select id="d-acc"></select></div>
      <div class="field s6" id="d-ridwrap" hidden><label for="d-rid">Gehört zu einer geplanten Rate?</label><select id="d-rid"></select><span class="hint">Dann gilt die geplante Rate als bezahlt und wird nicht zusätzlich als offen gezählt.</span></div>
      <div class="field s2" id="d-catwrap"><label for="d-cat">Kategorie</label><select id="d-cat">${catOpts(lastCat||S.cats[0]?.id)}</select></div>
      <div class="field s6"><label for="d-note">Beschreibung</label><input id="d-note" type="text" placeholder="z. B. Rückzahlung, Einkauf für …"></div>

  <section><div class="sechead"><h2>Buchungen</h2>
      <select id="pmonth" style="max-width:13rem" data-act2="personMonth" aria-label="Monat filtern">${opt('','Gesamte Historie',pm)}${txMonths.map(k=>opt(k,monthName(k),pm)).join('')}</select></div>
    ${ms?`<div class="grid">
      <div class="stat"><span>Offen am Monatsanfang</span><b>${fmt(startBal)}</b></div>
      <div class="stat"><span>Erhalten</span><b>${fmt(ms.received)}</b></div>
      <div class="stat"><span>Rückzahlungen</span><b>${fmt(ms.repaid)}</b></div>
      <div class="stat"><span>Für Person bezahlt</span><b>${fmt(ms.paidFor)}</b></div>
      <div class="stat"><span>Sonstiger Ausgleich</span><b>${fmt(ms.credits)}</b></div>
      <div class="stat"><span>Ausgeglichen im Monat</span><b>${fmt(ms.settled)}</b></div>
      <div class="stat hl"><span>Offen am Monatsende</span><b>${fmt(run)}</b></div></div>`:''}
    <div class="panel tbl-wrap"><table><thead><tr><th class="l">Datum</th><th class="l">Beschreibung</th><th class="l">Typ</th><th>Betrag</th><th>Saldo danach</th><th class="l">Verknüpft</th><th></th></tr></thead><tbody>

      ${shown.length||before.length?`<tr class="tot"><td class="l" colspan="4">${pm?`Offen am Ende ${esc(monthName(pm))}`:'Noch offen'}</td><td>${fmt(pm?run:s.open)}</td><td></td><td></td></tr>`:''}

function syncDebtForm(){
  const tp = document.getElementById('d-type'); if(!tp) return;
  debtType = tp.value;
  const acc = document.getElementById('d-acc'), aw = document.getElementById('d-accwrap'), cw = document.getElementById('d-catwrap'), h = document.getElementById('d-hint');
  const prevAcc = acc.value;
  aw.hidden = tp.value==='debt_credit';
  const rw = document.getElementById('d-ridwrap'), rs = document.getElementById('d-rid');
  if(rw){ const key = bucketOf(document.getElementById('d-date')?.value||todayStr()); const o = openPlanOpts(key,'schulden',selPerson, rs.value); rs.innerHTML = o.html; rw.hidden = tp.value!=='debt_repay' || !o.count; if(rw.hidden) rs.value=''; }
  cw.hidden = tp.value!=='expense';
  acc.innerHTML = accOpts(prevAcc || S.accounts[0].id, tp.value==='debt_in');
  h.textContent = ({
    debt_in:'Die Person gibt dir Geld. Die Schuld steigt. Mit Konto: das Geld kommt auf dieses Konto. „kein Konto“: nur für Schulden, die schon vor der App bestanden.',
    debt_repay:'Du zahlst zurück. Die Schuld sinkt und der Betrag geht vom Konto ab – genau einmal.',
    expense:'Du kaufst etwas für die Person. Das erscheint als normale Ausgabe UND reduziert gleichzeitig die Schuld bei dieser Person.',
    debt_credit:'Die Schuld sinkt ohne Geldfluss, z. B. wenn die Person dir etwas erlässt.'

}

/* ---------- Sparziele ---------- */
VIEWS.sparen = function(){
  const key = cur, L = dis(key);
  const cards = S.goals.map(g=>{
    const s = goalSaved(g), pct = g.target ? Math.min(100, s/g.target*100) : 0, v = goalVal(key,g);

    return `<div class="card">
      <div class="top2"><b>${esc(g.name)} ${g.emergency?'<span class="chip acc">Notfallreserve</span>':''}</b><span class="num">aktuell <b>${fmt(s)}</b>${g.target?` von ${fmt(g.target)} · Fortschritt ${pct.toFixed(1).replace('.',',')} %`:''}</span></div>
      ${g.target?`<div class="track"><div class="fill good" style="width:${pct.toFixed(1)}%"></div></div>`:''}
      ${g.target?`<span class="hint">${open<=0?'Ziel erreicht ✓':`noch ${fmt(open)}${n?` · mit ${fmt(g.monthly)} im Monat etwa ${esc(monthName(shiftMonth(monthKey(new Date()), n)))}`:''}`}</span>`:''}
      <div class="row w3"><label class="name" for="gv-${esc(g.id)}">${esc(monthName(key))}: zurücklegen</label>
        <input id="gv-${esc(g.id)}" class="amt" type="text" inputmode="decimal" placeholder="0,00" value="${amtIn(v.amount)}" data-bind="M|goals|${esc(g.id)}|amount" data-type="amt" ${L}>
        <label class="paid"><input type="checkbox" id="gd-${esc(g.id)}" data-bind="M|goals|${esc(g.id)}|done" data-type="bool" ${v.done?'checked':''} ${L}> zurückgelegt</label></div>
      <details id="det-g-${esc(g.id)}"><summary class="linkbtn">Ziel bearbeiten</summary><div class="defgrid" style="margin-top:8px">
        <div class="field s6"><label for="g-${esc(g.id)}-name">Name</label><input type="text" id="g-${esc(g.id)}-name" value="${esc(g.name)}" data-bind="S|goals|${esc(g.id)}|name" data-type="str"></div>
        <div class="field s2"><label for="g-${esc(g.id)}-target">Zielbetrag</label><input class="amt" type="text" inputmode="decimal" id="g-${esc(g.id)}-target" value="${amtIn(g.target)}" data-bind="S|goals|${esc(g.id)}|target" data-type="amt"></div>
        <div class="field s2"><label for="g-${esc(g.id)}-start">Schon gespart (vor der App)</label><input class="amt" type="text" inputmode="decimal" id="g-${esc(g.id)}-start" value="${amtIn(g.start)}" data-bind="S|goals|${esc(g.id)}|start" data-type="amt"></div>
        <div class="field s2"><label for="g-${esc(g.id)}-monthly">Pro Monat</label><input class="amt" type="text" inputmode="decimal" id="g-${esc(g.id)}-monthly" value="${amtIn(g.monthly)}" data-bind="S|goals|${esc(g.id)}|monthly" data-type="amt"></div>
        <label class="paid s4"><input type="checkbox" id="g-${esc(g.id)}-em" data-bind="S|goals|${esc(g.id)}|emergency" data-type="bool" ${g.emergency?'checked':''}> Als Notfallreserve markieren</label>
        <div class="s2" style="text-align:right">${delBtn('goal:'+g.id,'Sparziel löschen')}</div>

/* ---------- Wiederkehrend ---------- */
VIEWS.wiederkehrend = function(){
  const key = cur, L = dis(key), items = planItems(key);
  const planned = sum(items.filter(p=>!p.skip), p=>p.amount), paid = sum(items.filter(p=>p.paid), p=>p.tx.amount), open = sum(items.filter(p=>!p.paid&&!p.skip), p=>p.amount);

    const n = daysBetween(todayStr(), p.due);
    const state = p.paid ? `<button class="secondary on" data-act="planUndo" data-id="${esc(p.r.id)}" ${L}>✓ bezahlt ${fmtDay(p.tx.date)}</button>`
      : p.skip ? `<span class="chip">ausgesetzt</span>` : `<button class="secondary" data-act="planPay" data-id="${esc(p.r.id)}" ${L}>Als bezahlt markieren</button>`;

/* ---------- Monat ---------- */
VIEWS.monat = function(){

  const planRows = plan.filter(p=>!p.skip).map(p=>`<tr><td class="l">${esc(p.r.name)}<br><small class="hint">${esc(KINDS[p.r.kind])} · fällig ${fmtDay(p.due)}</small></td><td>${fmt(p.amount)}</td><td>${p.paid?fmt(p.tx.amount):'–'}</td><td>${status(p.paid)}</td></tr>`).join('');

function yearSummary(y){
  const rows = []; let income=0,out=0,saved=0,debtPaid=0,n=0; const cats={};
  for(let i=1;i<=12;i++){
    const key = `${y}-${pad(i)}`, has = !!months[key];
    const c = has ? calcM(key) : null;
    if(has){ n++; income+=c.income; out+=c.out; saved+=c.goalsDone; debtPaid += c.repaid + c.paidFor + c.credits; Object.entries(c.byCat).forEach(([k,v])=>cats[k]=(cats[k]||0)+v); }
    rows.push({key, has, c});
  }
  const top = Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  return {rows, income:r2(income), out:r2(out), saved:r2(saved), debtPaid:r2(debtPaid), avgOut: n?r2(out/n):0, topCat: top?{name: top[0]==='_none'?'Ohne Kategorie':catName(top[0]), v:r2(top[1])}:null};
}
function compareMonths(a, b){
  const ca = calcM(a), cb = calcM(b);
  const rows = [
    {l:'Einnahmen (tatsächlich)', a:cb.income, b:ca.income},
    {l:'Feste Kosten (bezahlt)', a:cb.fixedPaid, b:ca.fixedPaid, cost:1},
    {l:'Schulden-Rückzahlungen', a:cb.repaid, b:ca.repaid, cost:1}
  ];
  new Set([...Object.keys(ca.byCat), ...Object.keys(cb.byCat)]).forEach(id=>rows.push({l:id==='_none'?'Ohne Kategorie':catName(id), a:cb.byCat[id]||0, b:ca.byCat[id]||0, cost:1}));
  rows.push({l:'Ausgaben gesamt (tatsächlich)', a:cb.out, b:ca.out, cost:1, tot:1});
  rows.push({l:'Monatsergebnis', a:cb.left, b:ca.left, tot:1});
  rows.push({l:'Kontostand Monatsende', a:cb.available, b:ca.available, tot:1});
  rows.forEach(r=>r.d=r2(r.b-r.a));
  return rows;
}

/* Datenbindung: data-bind="S|pfad…" (Einstellungen) oder "M|pfad…" (aktueller Monat) */
function readBound(el){
  const tp = el.dataset.type;
  if(tp==='bool') return el.checked;
  if(tp==='amt') return parseAmt(el.value);
  if(tp==='amtneg') return el.value.trim()==='' ? null : parseAmt(el.value, true);
  if(tp==='actual'){
    if(el.value.trim()==='') return null;
    const acc = el.dataset.bind.split('|').pop(), prevAt = months[cur]?.actual?.[acc]?.at;
    const at = prevAt || (nowKey() > cur ? monthLastDay(cur) : todayStr());
    return {amount: parseAmt(el.value, true), at};
  }
  if(tp==='int') return parseInt(el.value,10)||1;
  if(tp==='month') return /^\d{4}-\d{2}$/.test(el.value) ? el.value : S.budgetStart;
  if(tp==='date') return /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : monthLastDay(cur);
  if(tp==='day') return Math.min(31, Math.max(1, parseInt(el.value,10)||1));
  return el.value.trim();
}
function setPath(root, segs, val){
  let o = root;
  for(let i=0;i<segs.length-1;i++){
    const s = segs[i];
    if(Array.isArray(o)){ o = o.find(x=>x.id===s); if(!o) return; }
    else { if(o[s]==null || typeof o[s]!=='object') o[s] = {}; o = o[s]; }
  }
  const last = segs[segs.length-1];
  if(Array.isArray(o)) return;
  if(val===null) delete o[last]; else o[last] = val;
}
function applyBound(el, save){
  const [root, ...segs] = el.dataset.bind.split('|');
  const val = readBound(el);
  if(root==='S'){
    if(segs[0]==='budgetStart'){
      if(!save) return;
      // Nur die Einstellung ändert sich – keine Buchungen, Monate oder Start-/Enddaten werden angefasst
      editSettings(s=>{ s.budgetStart = val; });
      toast(`Budgetverwaltung beginnt jetzt im ${monthName(val)}.`);
      return;
    }
    if(segs[0]==='payday' && payMode()){
      if(!save) return;
      if(val < 2){ toast('Für einen Gehaltsmonat muss der Gehaltstag nach dem 1. liegen. Stelle sonst „Monat beginnt am“ auf den 1.'); render(true); return; }
      const n = changeMonthRule(s=>{ s.payday = val; }, 'vor Änderung des Gehaltstags');
      toast(`Gehaltstag ${val}. – Monate laufen jetzt vom ${val}. bis zum ${val-1}.${n?` ${n} Buchung${n===1?'':'en'} neu zugeordnet.`:''}`);
      return;
    }
    editSettings(s=>setPath(s, segs, val), save);
    if(save && segs[0]==='recurring' && segs[2]==='amount') propagatePlan('plan', segs[1], val);
    if(save && segs[0]==='incomes' && segs[2]==='amount') propagatePlan('incomePlan', segs[1], val);
  } else {
    if(isClosed(cur)){ if(save) lockedMsg(cur); return; }
    editMonth(cur, m=>setPath(m, segs, val), save);
  }
}
/* Betragsänderung einer Vorlage gilt für aktuellen + künftige, noch offene, nicht abgeschlossene Monate */
function propagatePlan(field, id, val){
  const now = nowKey();
  Object.keys(months).forEach(k=>{
    if(k < now || isClosed(k)) return;
    const p = months[k][field]?.[id]; if(!p) return;
    if(p.paidTx || p.tx) return;
    p.amount = val; persistMonth(k);
  });
}

  const A = {
    del(){
      const key = b.dataset.key;
      if(armed!==key){ armed=key; clearTimeout(armedTimer); armedTimer=setTimeout(()=>{armed=null; render(true);},3500); render(true); return; }

function carryOver(key, src){
  if(!managed(shiftMonth(key,-1)) || !managed(key)){ toast('Ein Übertrag gibt es erst ab dem Startmonat der Budgetverwaltung.'); return; }
  const prev = shiftMonth(key,-1); const pb = balances(prev);
  const ok = editMonth(key, m=>{ if(src==='actual'){ m.opening = {}; pb.rows.forEach(r=>{ m.opening[r.a.id] = r.actual!=null ? r.actual : r.calc; }); } else delete m.opening; });
  if(ok) toast(src==='actual' ? `Startguthaben ${monthName(key)}: tatsächlicher Endsaldo übernommen.` : `Startguthaben ${monthName(key)} wird automatisch aus ${monthName(prev)} übernommen (${fmt(pb.total)}).`);
}
function closeMonth(key){
  autoBackup('vor Monatsabschluss');
  const c = calcM(key), bal = balances(key);
  const open = [...incomeItems(key).filter(i=>!i.skip&&!i.received).map(i=>`Einnahme ${i.i.name} ${fmt(i.amount)}`), ...planItems(key).filter(p=>!p.skip&&!p.paid).map(p=>`${p.r.name} ${fmt(p.amount)}`)];
  const snap = {opening:c.opening, income:c.income, out:c.out, repaid:c.repaid, paidFor:c.paidFor, saved:c.goalsDone, savedPlanned:c.goalsPlanned, result:c.left,
    closing: bal.total, accounts: bal.rows.map(r=>({id:r.a.id, name:r.a.name, opening:r.opening||0, closing:r.calc, actual:r.actual})), open};
  const wasAuto = bal.rows.filter(r=>r.openingSrc==='auto').map(r=>r.a.id);
  editMonth(key, m=>{ m.opening = {...(m.opening||{})}; bal.rows.forEach(r=>{ if(r.openingSrc!=='none') m.opening[r.a.id] = r.opening; }); m.closed = {at:new Date().toISOString(), snap, autoOpening: wasAuto}; });
  const next = shiftMonth(key,1);
  toast(`${monthName(key)} abgeschlossen. Startguthaben ${monthName(next)}: ${fmt(bal.total)}.`);
}

const CRC = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc = new TextEncoder(); const parts=[]; const central=[]; let off=0;

    const name = enc.encode(f.name), data = typeof f.data==='string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,0,true); h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,0,true); c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + data.length;
  }
  const csize = central.reduce((a,x)=>a+x.length,0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

try{ const t=localStorage.getItem('budget-tab'); if(t && VIEWS[t]) tab=t; }catch(_){}
const configured = !Object.values(firebaseConfig).some(v=>String(v).startsWith('HIER'));
function showApp(){ document.getElementById('login').hidden = true; document.getElementById('app').hidden = false; if(!showApp.done){ cur = nowKey(); showApp.done = true; } render(true); }
function migrationNotice(){ toast('Deine Daten wurden automatisch ins neue Format übernommen. Eine Sicherung der alten Daten liegt unter Berichte › Automatische Sicherungen.'); }

if(!configured){
  mode = 'local';
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem('budget-v3')||'null'); }catch(e){}
  let migrated = false;
  if(!raw){ try{ const old = JSON.parse(localStorage.getItem('budget-v2')||'null'); if(old){ raw = old; } }catch(e){} }
  if(raw){
    if((raw.S?.v||0) < 3){ S = raw.S; months = raw.months||{}; autoBackup('vor Umstellung auf neue Version'); }
    const res = migrateAll(raw.S, raw.months||{}); S = res.S; months = res.months; migrated = res.migrated;
    if(migrated) saveLocal();
  }
  autoBackup();
  const n = document.getElementById('notice');
  n.textContent = 'Demo-Modus: Deine Daten bleiben nur in diesem Browser. Richte Firebase ein (siehe Anleitung), damit Handy und Laptop dieselben Daten haben.';
  n.hidden = false;
  showApp();
  if(migrated) migrationNotice();
} else {
  startCloud().catch(err=>{ console.error(err); document.getElementById('login').hidden=false; showLoginError('Firebase konnte nicht geladen werden. Prüfe die Internetverbindung und die Zugangsdaten.'); });
}

function showLoginError(msg){ const el=document.getElementById('l-err'); el.textContent=msg; el.hidden=!msg; }
function authMsg(code){
  return ({
    'auth/invalid-credential':'E-Mail oder Passwort ist falsch.', 'auth/wrong-password':'E-Mail oder Passwort ist falsch.',
    'auth/user-not-found':'Zu dieser E-Mail gibt es kein Konto. Erstelle zuerst ein neues Konto.',
    'auth/email-already-in-use':'Mit dieser E-Mail gibt es schon ein Konto. Melde dich an.',
    'auth/weak-password':'Das Passwort braucht mindestens 6 Zeichen.', 'auth/invalid-email':'Bitte gib eine gültige E-Mail ein.',
    'auth/popup-closed-by-user':'Die Google-Anmeldung wurde geschlossen.',
    'auth/popup-blocked':'Das Anmeldefenster wurde blockiert. Erlaube Pop-ups oder nutze E-Mail und Passwort.',
    'auth/unauthorized-domain':'Diese Adresse ist in Firebase noch nicht freigegeben (Authentication → Einstellungen → Autorisierte Domains).',
    'auth/operation-not-allowed':'Diese Anmeldeart ist in Firebase noch nicht eingeschaltet.',
    'auth/network-request-failed':'Keine Internetverbindung.', 'auth/too-many-requests':'Zu viele Versuche. Warte kurz und versuche es erneut.'
  })[code] || 'Anmeldung hat nicht geklappt ('+code+').';
}

async function startCloud(){
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}`;
  const [appM, authM, fsM] = await Promise.all([import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-firestore.js`)]);
  F = {...authM, ...fsM};
  const app = appM.initializeApp(firebaseConfig);
  fauth = authM.getAuth(app);
  try{ fdb = fsM.initializeFirestore(app, {localCache: fsM.persistentLocalCache({tabManager: fsM.persistentMultipleTabManager()})}); }
  catch(e){ fdb = fsM.getFirestore(app); }

  let signup = false;
  document.getElementById('l-toggle').onclick = ()=>{ signup=!signup; document.getElementById('l-submit').textContent = signup?'Konto erstellen':'Anmelden'; document.getElementById('l-toggle').textContent = signup?'Ich habe schon ein Konto':'Neues Konto erstellen'; document.getElementById('l-pw').autocomplete = signup?'new-password':'current-password'; showLoginError(''); };
  document.getElementById('loginform').onsubmit = async e=>{
    e.preventDefault(); showLoginError('');
    const mail=document.getElementById('l-mail').value.trim(), pw=document.getElementById('l-pw').value;
    try{ if(signup) await authM.createUserWithEmailAndPassword(fauth, mail, pw); else await authM.signInWithEmailAndPassword(fauth, mail, pw); }
    catch(err){ showLoginError(authMsg(err.code)); }
  };
  document.getElementById('google').onclick = async ()=>{ showLoginError(''); try{ await authM.signInWithPopup(fauth, new authM.GoogleAuthProvider()); }catch(err){ showLoginError(authMsg(err.code)); } };
  document.getElementById('l-reset').onclick = async ()=>{
    const mail=document.getElementById('l-mail').value.trim();
    if(!mail){ showLoginError('Gib oben deine E-Mail ein, dann schicken wir dir einen Link.'); return; }
    try{ await authM.sendPasswordResetEmail(fauth, mail); showLoginError(''); toast('E-Mail zum Zurücksetzen wurde gesendet.'); }catch(err){ showLoginError(authMsg(err.code)); }
  };

  authM.onAuthStateChanged(fauth, async u=>{
    unsub.forEach(f=>f()); unsub=[];
    user = u;
    if(!u){ mode='local'; S=normalizeS(makeDefaults()); months={}; document.getElementById('app').hidden=true; document.getElementById('login').hidden=false; return; }
    mode = 'cloud';
    // Erst einmal alles laden und bei Bedarf migrieren, dann live verfolgen
    let rawS = null, rawM = {};
    try{
      const sd = await fsM.getDoc(fsM.doc(fdb,'users',u.uid,'data','settings'));
      if(sd.exists()) rawS = sd.data();
      const md = await fsM.getDocs(fsM.collection(fdb,'users',u.uid,'months'));
      md.forEach(d=>{ rawM[d.id] = d.data(); });
    }catch(e){ toast('Daten konnten nicht geladen werden. Prüfe die Firebase-Regeln.'); }
    const needsMig = rawS && (rawS.v||0) < 3;
    if(needsMig){ S = rawS; months = rawM; autoBackup('vor Umstellung auf neue Version'); }
    const res = migrateAll(rawS, rawM); S = res.S; months = res.months;
    if(res.migrated){ persistSettings(); Object.keys(months).forEach(k=>persistMonth(k)); }
    autoBackup();
    showApp();
    if(res.migrated) migrationNotice();
    unsub.push(fsM.onSnapshot(fsM.doc(fdb,'users',u.uid,'data','settings'), snap=>{
      if(!snap.exists()) return;
      const d = snap.data(); if((d.v||0) < 3) return;
      const ns = normalizeS(clone(d));
      if(JSON.stringify(ns)===JSON.stringify(S)) return;
      S = ns; render();
    }, ()=>toast('Keine Verbindung zu deinen Daten. Prüfe die Firebase-Regeln.')));
    unsub.push(fsM.onSnapshot(fsM.collection(fdb,'users',u.uid,'months'), snap=>{
      const nm = {}; snap.forEach(d=>{ nm[d.id] = normalizeMonth(clone(d.data())); });
      if(JSON.stringify(nm)===JSON.stringify(months)) return;
      months = nm; render();
    }, ()=>{}));
  });
}

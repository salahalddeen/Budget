  const t1 = pm ? `${pm}-${pad(daysIn(pm))}` : todayStr();
  return `
  <section><div class="sechead"><button class="linkbtn" data-act="personBack">‹ Alle Personen</button></div>
    <div class="sechead"><h2>Schuldenkonto ${esc(p.name)}</h2>${statusChip(s.status)}</div>
    <p class="hint">Gesamte Historie · ${txs.length} ${txs.length===1?'Buchung':'Buchungen'}${txs.length?` seit ${fmtDate(txs[0].date)}`:''}</p>
    <div class="grid">
      <div class="stat"><span>Ursprünglich erhalten</span><b>${fmt(s.original)}</b></div>
      <div class="stat"><span>Zusätzlich erhalten</span><b>${fmt(s.additional)}</b></div>
      <div class="stat"><span>Zurückgezahlt</span><b>${fmt(s.repaid)}</b></div>
      <div class="stat"><span>Für Person bezahlt</span><b>${fmt(s.paidFor)}</b></div>
      <div class="stat"><span>Sonstiger Ausgleich</span><b>${fmt(s.credits)}</b></div>
      <div class="stat"><span>Gesamt ausgeglichen</span><b>${fmt(s.settled)}</b></div>
      <div class="stat hl"><span>Noch offen</span><b>${fmt(s.open)}</b></div>
    </div>
    ${s.status==='ueberzahlt'?`<div class="warnrow"><i>⚠</i><div>Du hast ${fmt(-s.open)} mehr ausgeglichen als erhalten. ${esc(p.name)} schuldet dir diesen Betrag.</div></div>`:''}
  </section>
  <section><div class="sechead"><h2>Neue Buchung</h2>${s.open>0?`<button class="secondary" style="white-space:normal;text-align:left" data-act="settleAll">Schuld vollständig ausgleichen (${fmt(s.open)})</button>`:''}</div>
    <form class="addform" id="debtform" autocomplete="off">
      <div class="field s3"><label for="d-type">Art</label><select id="d-type">${opt('debt_in','Geld erhalten (Schuld steigt)',debtType)}${opt('debt_repay','Rückzahlung (ich zahle zurück)',debtType)}${opt('expense','Für die Person bezahlt',debtType)}${opt('debt_credit','Gutschrift / sonstiger Ausgleich (ohne Geldfluss)',debtType)}</select></div>
      <div class="field s3 half"><label for="d-amt">Betrag (€)</label><input id="d-amt" class="amt" type="text" inputmode="decimal" placeholder="0,00"></div>
      <div class="field s2 half"><label for="d-date">Datum</label><input id="d-date" type="date" value="${todayStr()}"></div>
      <div class="field s2" id="d-accwrap"><label for="d-acc">Konto</label><select id="d-acc"></select></div>
      <div class="field s6" id="d-ridwrap" hidden><label for="d-rid">Gehört zu einer geplanten Rate?</label><select id="d-rid"></select><span class="hint">Dann gilt die geplante Rate als bezahlt und wird nicht zusätzlich als offen gezählt.</span></div>
      <div class="field s2" id="d-catwrap"><label for="d-cat">Kategorie</label><select id="d-cat">${catOpts(lastCat||S.cats[0]?.id)}</select></div>
      <div class="field s6"><label for="d-note">Beschreibung</label><input id="d-note" type="text" placeholder="z. B. Rückzahlung, Einkauf für …"></div>
      <div class="s6 hint" id="d-hint"></div>
      <div class="field s6 fbtn"><button class="primary" type="submit">Buchen</button></div>
    </form></section>
  <section><div class="sechead"><h2>Buchungen</h2>
      <select id="pmonth" style="max-width:13rem" data-act2="personMonth" aria-label="Monat filtern">${opt('','Gesamte Historie',pm)}${txMonths.map(k=>opt(k,monthName(k),pm)).join('')}</select></div>
    ${ms?`<div class="grid">
      <div class="stat"><span>Offen am Monatsanfang</span><b>${fmt(startBal)}</b></div>
      <div class="stat"><span>Erhalten</span><b>${fmt(ms.received)}</b></div>
      <div class="stat"><span>Rückzahlungen</span><b>${fmt(ms.repaid)}</b></div>
      <div class="stat"><span>Für Person bezahlt</span><b>${fmt(ms.paidFor)}</b></div>
      <div class="stat"><span>Sonstiger Ausgleich</span><b>${fmt(ms.credits)}</b></div>
      <div class="stat"><span>Ausgeglichen im Monat</span><b>${fmt(ms.settled)}</b></div>
      <div class="stat hl"><span>Offen am Monatsende</span><b>${fmt(run)}</b></div></div>`:''}
    <div class="panel tbl-wrap"><table><thead><tr><th class="l">Datum</th><th class="l">Beschreibung</th><th class="l">Typ</th><th>Betrag</th><th>Saldo danach</th><th class="l">Verknüpft</th><th></th></tr></thead><tbody>
      ${pm && before.length?`<tr><td class="l">${fmtDate(pm+'-01')}</td><td class="l" colspan="3">Übertrag aus den Vormonaten</td><td>${fmt(startBal)}</td><td></td><td></td></tr>`:''}
      ${ledger || `<tr><td class="l" colspan="7">${pm?'Keine Buchungen in diesem Monat.':'Noch keine Buchungen.'}</td></tr>`}
      ${shown.length||before.length?`<tr class="tot"><td class="l" colspan="4">${pm?`Offen am Ende ${esc(monthName(pm))}`:'Noch offen'}</td><td>${fmt(pm?run:s.open)}</td><td></td><td></td></tr>`:''}
    </tbody></table></div>
    <p class="hint">Der offene Betrag wird immer aus diesen Buchungen berechnet. „Für Person bezahlt“ ist dieselbe Buchung wie die Ausgabe – sie wird nur einmal vom Konto abgezogen. Auch nach vollständiger Bezahlung bleibt die Historie erhalten.</p></section>
  <section><div class="sechead"><h2>Kontoübersicht als PDF</h2></div>
    <div class="addform">
      <div class="field s2 half"><label for="pdf-from">Von</label><input id="pdf-from" type="date" value="${esc(t0)}"></div>
      <div class="field s2 half"><label for="pdf-to">Bis</label><input id="pdf-to" type="date" value="${esc(t1)}"></div>
      <div class="field s2 fbtn"><button class="primary" data-act="personPdf" type="button">Kontoübersicht als PDF</button></div>
      <p class="hint s6">Erstellt eine PDF-Datei zum Herunterladen und Weitergeben.</p>
    </div></section>
  <section><div class="sechead"><h2>Person</h2></div>
    <div class="panel"><div class="srow" style="grid-template-columns:minmax(0,1fr) auto"><input type="text" id="pn-${esc(p.id)}" value="${esc(p.name)}" data-bind="S|people|${esc(p.id)}|name" data-type="str" aria-label="Name"><span></span></div>
    <div class="srow" style="grid-template-columns:minmax(0,1fr) auto"><input type="text" id="pnote-${esc(p.id)}" value="${esc(p.note)}" placeholder="Notiz (optional)" data-bind="S|people|${esc(p.id)}|note" data-type="str" aria-label="Notiz">${txs.length?'<span class="hint">Löschen nur ohne Buchungen</span>':delBtn('person:'+p.id,'Person löschen')}</div></div></section>`;
}
function syncDebtForm(){
  const tp = document.getElementById('d-type'); if(!tp) return;
  debtType = tp.value;
  const acc = document.getElementById('d-acc'), aw = document.getElementById('d-accwrap'), cw = document.getElementById('d-catwrap'), h = document.getElementById('d-hint');
  const prevAcc = acc.value;
  aw.hidden = tp.value==='debt_credit';
  const rw = document.getElementById('d-ridwrap'), rs = document.getElementById('d-rid');
  if(rw){ const key = bucketOf(document.getElementById('d-date')?.value||todayStr()); const o = openPlanOpts(key,'schulden',selPerson, rs.value); rs.innerHTML = o.html; rw.hidden = tp.value!=='debt_repay' || !o.count; if(rw.hidden) rs.value=''; }
  cw.hidden = tp.value!=='expense';
  acc.innerHTML = accOpts(prevAcc || S.accounts[0].id, tp.value==='debt_in');
  h.textContent = ({
    debt_in:'Die Person gibt dir Geld. Die Schuld steigt. Mit Konto: das Geld kommt auf dieses Konto. „kein Konto“: nur für Schulden, die schon vor der App bestanden.',
    debt_repay:'Du zahlst zurück. Die Schuld sinkt und der Betrag geht vom Konto ab – genau einmal.',
    expense:'Du kaufst etwas für die Person. Das erscheint als normale Ausgabe UND reduziert gleichzeitig die Schuld bei dieser Person.',
    debt_credit:'Die Schuld sinkt ohne Geldfluss, z. B. wenn die Person dir etwas erlässt.'
  })[tp.value];
}

/* ---------- Sparziele ---------- */
VIEWS.sparen = function(){
  const key = cur, L = dis(key);
  const cards = S.goals.map(g=>{
    const s = goalSaved(g), pct = g.target ? Math.min(100, s/g.target*100) : 0, v = goalVal(key,g);
    const open = g.target ? Math.max(0,g.target-s) : 0, n = open>0 && g.monthly>0 ? Math.ceil(open/g.monthly) : 0;
    return `<div class="card">
      <div class="top2"><b>${esc(g.name)} ${g.emergency?'<span class="chip acc">Notfallreserve</span>':''}</b><span class="num">aktuell <b>${fmt(s)}</b>${g.target?` von ${fmt(g.target)} · Fortschritt ${pct.toFixed(1).replace('.',',')} %`:''}</span></div>
      ${g.target?`<div class="track"><div class="fill good" style="width:${pct.toFixed(1)}%"></div></div>`:''}
      ${g.target?`<span class="hint">${open<=0?'Ziel erreicht ✓':`noch ${fmt(open)}${n?` · mit ${fmt(g.monthly)} im Monat etwa ${esc(monthName(shiftMonth(monthKey(new Date()), n)))}`:''}`}</span>`:''}
      <div class="row w3"><label class="name" for="gv-${esc(g.id)}">${esc(monthName(key))}: zurücklegen</label>
        <input id="gv-${esc(g.id)}" class="amt" type="text" inputmode="decimal" placeholder="0,00" value="${amtIn(v.amount)}" data-bind="M|goals|${esc(g.id)}|amount" data-type="amt" ${L}>
        <label class="paid"><input type="checkbox" id="gd-${esc(g.id)}" data-bind="M|goals|${esc(g.id)}|done" data-type="bool" ${v.done?'checked':''} ${L}> zurückgelegt</label></div>
      <details id="det-g-${esc(g.id)}"><summary class="linkbtn">Ziel bearbeiten</summary><div class="defgrid" style="margin-top:8px">
        <div class="field s6"><label for="g-${esc(g.id)}-name">Name</label><input type="text" id="g-${esc(g.id)}-name" value="${esc(g.name)}" data-bind="S|goals|${esc(g.id)}|name" data-type="str"></div>
        <div class="field s2"><label for="g-${esc(g.id)}-target">Zielbetrag</label><input class="amt" type="text" inputmode="decimal" id="g-${esc(g.id)}-target" value="${amtIn(g.target)}" data-bind="S|goals|${esc(g.id)}|target" data-type="amt"></div>
        <div class="field s2"><label for="g-${esc(g.id)}-start">Schon gespart (vor der App)</label><input class="amt" type="text" inputmode="decimal" id="g-${esc(g.id)}-start" value="${amtIn(g.start)}" data-bind="S|goals|${esc(g.id)}|start" data-type="amt"></div>
        <div class="field s2"><label for="g-${esc(g.id)}-monthly">Pro Monat</label><input class="amt" type="text" inputmode="decimal" id="g-${esc(g.id)}-monthly" value="${amtIn(g.monthly)}" data-bind="S|goals|${esc(g.id)}|monthly" data-type="amt"></div>
        <label class="paid s4"><input type="checkbox" id="g-${esc(g.id)}-em" data-bind="S|goals|${esc(g.id)}|emergency" data-type="bool" ${g.emergency?'checked':''}> Als Notfallreserve markieren</label>
        <div class="s2" style="text-align:end">${delBtn('goal:'+g.id,'Sparziel löschen')}</div>
      </div></details></div>`; }).join('');
  const em = S.goals.filter(g=>g.emergency);
  return `
  ${em.length?`<section><div class="grid">${em.map(g=>{ const s=goalSaved(g); return `<div class="stat hl"><span>Notfallreserve · ${esc(g.name)}</span><b>${fmt(s)}</b><span class="hint">${g.target?`Ziel ${fmt(g.target)} · ${(s/g.target*100).toFixed(1).replace('.',',')} %`:'kein Ziel festgelegt'}</span></div>`; }).join('')}</div></section>`:''}

    <button class="ghost" data-act="addGoal">+ Sparziel hinzufügen</button></section>`;

/* ---------- Wiederkehrend ---------- */
VIEWS.wiederkehrend = function(){

  const planned = sum(items.filter(p=>!p.skip), p=>p.amount), paid = sum(items.filter(p=>p.paid), p=>p.tx.amount), open = sum(items.filter(p=>!p.paid&&!p.skip), p=>p.amount);

      <div class="row w3"><label class="name" for="pl-${esc(p.r.id)}">Geplant<small>${p.paid?`Bezahlt: ${fmt(p.tx.amount)}${Math.abs(p.tx.amount-p.amount)>=.01?` (Abweichung ${fmtS(p.tx.amount-p.amount)})`:''} · ${esc(accName(p.tx.account))}`:esc(accName(p.r.account))}</small></label>
      <input id="pl-${esc(p.r.id)}" class="amt" type="text" inputmode="decimal" value="${amtIn(p.amount)}" data-bind="M|plan|${esc(p.r.id)}|amount" data-type="amt" aria-label="Geplanter Betrag" ${L}>
      <div class="btnrow">${state}${!p.paid?`<button class="act" data-act="planSkip" data-id="${esc(p.r.id)}" ${L}>${p.skip?'wieder einplanen':'aussetzen'}</button>`:''}</div></div></div>`;
  }).join('');
  const up = upcoming(31);
  const defs = S.recurring.map(r=>{ const id=esc(r.id); return `<details class="card" id="det-r-${id}"><summary><b>${esc(r.name)}</b> · ${fmt(r.amount)} · ${esc(INTERVALS[r.interval]||r.interval+' Monate')} · am ${r.dueDay}. ${r.active===false?'<span class="chip">inaktiv</span>':''}</summary>
    <div class="defgrid" style="margin-top:10px">
      <div class="field s4 wide"><label for="r-${id}-name">Name</label><input type="text" id="r-${id}-name" value="${esc(r.name)}" data-bind="S|recurring|${id}|name" data-type="str"></div>
      <div class="field s2"><label for="r-${id}-amount">Betrag</label><input class="amt" type="text" inputmode="decimal" id="r-${id}-amount" value="${amtIn(r.amount)}" data-bind="S|recurring|${id}|amount" data-type="amt"></div>
      <div class="field s2"><label for="r-${id}-kind">Kategorie</label><select id="r-${id}-kind" data-bind="S|recurring|${id}|kind" data-type="str" data-rerender="1">${Object.entries(KINDS).map(([k,l])=>opt(k,l,r.kind)).join('')}</select></div>
      <div class="field s2"><label for="r-${id}-interval">Intervall</label><select id="r-${id}-interval" data-bind="S|recurring|${id}|interval" data-type="int">${Object.entries(INTERVALS).map(([k,l])=>opt(k,l,r.interval)).join('')}</select></div>
      <div class="field s2"><label for="r-${id}-due">Fällig am (Tag)</label><input type="number" min="1" max="31" id="r-${id}-due" value="${r.dueDay}" data-bind="S|recurring|${id}|dueDay" data-type="day"></div>
      <div class="field s2"><label for="r-${id}-start">Start ${r.start?'':'(ab Budgetstart)'}</label><input type="month" id="r-${id}-start" value="${esc(r.start)}" data-bind="S|recurring|${id}|start" data-type="str" title="Leer lassen = ab Budgetstart"></div>
      <div class="field s2"><label for="r-${id}-end">Ende (optional)</label><input type="month" id="r-${id}-end" value="${esc(r.end)}" data-bind="S|recurring|${id}|end" data-type="str"></div>
      <div class="field s2"><label for="r-${id}-acc">Konto</label><select id="r-${id}-acc" data-bind="S|recurring|${id}|account" data-type="str">${accOpts(r.account)}</select></div>
      ${r.kind==='schulden'?`<div class="field s3"><label for="r-${id}-person">An Person</label><select id="r-${id}-person" data-bind="S|recurring|${id}|personId" data-type="str">${personOpts(r.personId,'– Person wählen –')}</select></div>`:''}
      <label class="paid s3"><input type="checkbox" id="r-${id}-active" data-bind="S|recurring|${id}|active" data-type="bool" ${r.active!==false?'checked':''}> aktiv</label>

    <div class="panel">${rows || '<div class="empty">In diesem Monat sind keine wiederkehrenden Zahlungen fällig.</div>'}</div>

/* ---------- Monat ---------- */
VIEWS.monat = function(){
  const key = cur, c = calcM(key), bal = balances(key), m = months[key];
  const prev = shiftMonth(key,-1), next = shiftMonth(key,1);
  const inc = incomeItems(key), plan = planItems(key), budgets = monthlyBudgets(key);
  const status = x => x ? '<span class="chip good">✓</span>' : '<span class="chip warn">offen</span>';
  const incRows = inc.filter(i=>!i.skip).map(i=>`<tr><td class="l">${esc(i.i.name)}</td><td>${fmt(i.amount)}</td><td>${i.received?fmt(i.tx.amount):'–'}</td><td>${status(i.received)}</td></tr>`).join('');
  const extraInc = sum(txsOf(key).filter(t=>t.type==='income'&&!t.incId), t=>t.amount);
  const planRows = plan.filter(p=>!p.skip).map(p=>`<tr><td class="l">${esc(p.r.name)}<br><small class="hint">${esc(KINDS[p.r.kind])} · fällig ${fmtDay(p.due)}</small></td><td>${fmt(p.amount)}</td><td>${p.paid?fmt(p.tx.amount):'–'}</td><td>${status(p.paid)}</td></tr>`).join('');
  const goalRows = S.goals.map(g=>{ const v=goalVal(key,g); return `<tr><td class="l">${esc(g.name)}</td><td>${fmt(v.amount)}</td><td>${v.done?fmt(v.amount):'–'}</td><td>${status(v.done)}</td></tr>`; }).join('');
  const budRows = budgets.map(b=>`<tr><td class="l">${esc(b.label)}</td><td>${fmt(b.limit)}</td><td>${fmt(b.spent)}</td><td class="${b.left<0?'neg':'pos'}">${fmt(b.left)}</td><td>${Math.round(b.pct*100)} %</td></tr>`).join('');
  const openList = [...inc.filter(i=>!i.skip&&!i.received).map(i=>`Einnahme ${i.i.name} ${fmt(i.amount)}`), ...plan.filter(p=>!p.skip&&!p.paid).map(p=>`${p.r.name} ${fmt(p.amount)}`)];
  let closeHtml;
  if(m?.closed){
    const s = m.closed.snap;
    closeHtml = `<div class="panel pad"><h3>✓ Abgeschlossen am ${fmtDate(m.closed.at.slice(0,10))}</h3>
      <div class="grid" style="margin-top:8px">
        ${s.opening!=null?`<div class="stat"><span>Startguthaben</span><b>${fmt(s.opening)}</b></div>`:''}<div class="stat"><span>Einnahmen</span><b>${fmt(s.income)}</b></div><div class="stat"><span>Ausgaben</span><b>${fmt(s.out)}</b></div>
        <div class="stat"><span>Schuldenzahlungen</span><b>${fmt(s.repaid)}</b></div><div class="stat"><span>Gespart</span><b>${fmt(s.saved)}</b></div>
        <div class="stat hl"><span>Endsaldo</span><b>${fmt(s.closing)}</b></div><div class="stat"><span>Offene Zahlungen</span><b>${s.open.length}</b></div>
      </div>
      ${s.open.length?`<p class="hint" style="margin-top:8px">Offen beim Abschluss: ${esc(s.open.join(' · '))}</p>`:''}
      <p class="hint" style="margin-top:8px">Ein abgeschlossener Monat kann nicht verändert werden.</p>
      <div class="btnrow" style="margin-top:8px"><button class="secondary danger ${armed==='reopen'?'armed':''}" data-act="reopen">${armed==='reopen'?'Wirklich wieder öffnen?':'Monat wieder öffnen'}</button></div></div>`;
  } else {
    closeHtml = `<div class="panel pad"><h3>Monat abschließen</h3>
      <p class="hint">Speichert Einnahmen, Ausgaben, Endsaldo, Schuldenzahlungen, Sparbeträge und offene Zahlungen dauerhaft. Danach ist der Monat gegen Änderungen gesperrt.</p>
      ${openList.length?`<div class="warnrow" style="margin-top:8px"><i>⚠</i><div>Noch offen: ${esc(openList.join(' · '))}</div></div>`:''}
      <p class="hint" style="margin-top:10px">Der Endsaldo (${fmt(bal.total)}) wird automatisch das Startguthaben für ${esc(monthName(next))}.</p>
      <div class="btnrow" style="margin-top:10px"><button class="primary" style="width:auto" data-act="closeMonth">${esc(monthName(key))} abschließen</button></div></div>`;
  }
  return `
  <section><div class="sechead"><h2>So viel Geld hast du</h2><button class="linkbtn" data-act="goto" data-tab="konten">Konten öffnen</button></div>
    <div class="panel tbl-wrap"><table><tbody>
      <tr><td class="l">Startguthaben am 01. ${!bal.anyOpening?'<span class="chip warn">nicht gesetzt</span>':bal.auto?`<span class="chip">aus ${esc(monthOnly(prev))}</span>`:'<span class="chip">eingetragen</span>'}</td><td>${fmt(c.opening)}</td></tr>
      <tr><td class="l">+ Einnahmen (tatsächlich eingegangen)</td><td class="pos">${fmt(c.income)}</td></tr>
      ${c.loans?`<tr><td class="l">+ Geld von Personen erhalten (Schulden)</td><td class="pos">${fmt(c.loans)}</td></tr>`:''}
      <tr><td class="l">− Feste Kosten (bezahlt)</td><td>${fmt(c.fixedPaid)}</td></tr>
      <tr><td class="l">− Variable Ausgaben</td><td>${fmt(c.variable)}</td></tr>
      <tr><td class="l">− Schulden-Rückzahlungen</td><td>${fmt(c.repaid)}</td></tr>
      <tr class="tot"><td class="l">= Verfügbar jetzt (Kontostand)</td><td class="${c.available<0?'neg':'pos'}">${fmt(c.available)}</td></tr>
      <tr><td class="l">− noch offene feste Zahlungen & Raten</td><td>${fmt(c.outOpen)}</td></tr>
      <tr><td class="l">− für Sparziele reserviert (bleibt auf dem Konto)</td><td>${fmt(c.savingsReserved)}</td></tr>
      <tr class="tot"><td class="l">= Voraussichtlich übrig am Monatsende</td><td class="${c.forecast<0?'neg':'pos'}">${fmt(c.forecast)}</td></tr>
    </tbody></table></div>
    ${c.incomeOpen?`<p class="hint">Noch erwartete Einnahmen (${fmt(c.incomeOpen)}) sind bewusst nicht eingerechnet. Sie zählen erst, wenn sie eingegangen sind.</p>`:''}
    <p class="hint">Monatsergebnis (Einnahmen − Ausgaben): <b class="num">${fmtS(c.left)}</b></p>
  </section>
  <section><div class="sechead"><h2>Geplant vs. tatsächlich</h2></div>
    <div class="panel tbl-wrap"><table><thead><tr><th class="l">Einnahmen</th><th>Geplant</th><th>Erhalten</th><th></th></tr></thead><tbody>
      ${incRows || '<tr><td class="l" colspan="4">Keine geplanten Einnahmen.</td></tr>'}

      <tr class="tot"><td class="l">Summe</td><td>${fmt(sum(inc.filter(i=>!i.skip),i=>i.amount))}</td><td>${fmt(c.incomeActual)}</td><td></td></tr></tbody></table></div>
    <div class="panel tbl-wrap"><table><thead><tr><th class="l">Feste Zahlungen</th><th>Geplant</th><th>Bezahlt</th><th></th></tr></thead><tbody>
      ${planRows || '<tr><td class="l" colspan="4">Keine.</td></tr>'}
      <tr class="tot"><td class="l">Summe</td><td>${fmt(sum(plan.filter(p=>!p.skip),p=>p.amount))}</td><td>${fmt(sum(plan.filter(p=>p.paid),p=>p.tx.amount))}</td><td></td></tr></tbody></table></div>
    ${budRows?`<div class="panel tbl-wrap"><table><thead><tr><th class="l">Budget</th><th>Budget</th><th>Ausgegeben</th><th>Verfügbar</th><th>Verbrauch</th></tr></thead><tbody>${budRows}</tbody></table></div>`:'<p class="hint">Tipp: Unter „Setup“ kannst du Budgets für Kategorien und Unterpunkte festlegen, z. B. Lebensmittel 200 €.</p>'}
    ${goalRows?`<div class="panel tbl-wrap"><table><thead><tr><th class="l">Sparen</th><th>Geplant</th><th>Zurückgelegt</th><th></th></tr></thead><tbody>${goalRows}</tbody></table></div>`:''}
</section>
  ${managed(key)||m?.closed?`<section><div class="sechead"><h2>Monatsabschluss</h2></div>${closeHtml}</section>`:''}`;
};

      <div class="row w3"><div class="name">PDF-Bericht ${esc(monthName(cur))}<small>Monatsübersicht, Kategorien, feste Kosten, Schulden, Sparziele</small></div><span></span><button class="secondary" data-act="monthPdf">PDF</button></div>
      <div class="row w3"><div class="name">PDF-Jahresbericht ${esc(y)}<small>Alle Monate und Jahreszahlen</small></div><span></span><button class="secondary" data-act="yearPdf">PDF</button></div>
      <div class="row w3"><div class="name">Schulden-Kontoübersicht<small>Pro Person unter „Schulden“ › Person › PDF erstellen</small></div><span></span><button class="secondary" data-act="goto" data-tab="schulden">Öffnen</button></div>

      ${yr.rows.map(r=>r.has?`<tr class="${r.key===cur?'cur':''}"><td class="l">${esc(monthOnly(r.key))}</td><td>${fmt(r.c.income)}</td><td>${fmt(r.c.out)}</td><td>${fmt(r.c.goalsPlanned)}</td><td class="${r.c.left<0?'neg':'pos'}">${fmt(r.c.left)}</td></tr>`:`<tr><td class="l">${esc(monthOnly(r.key))}</td><td colspan="4" style="color:var(--muted)">–</td></tr>`).join('')}
    </tbody></table></div>
    <div class="grid">
      <div class="stat"><span>Jahreseinnahmen</span><b>${fmt(yr.income)}</b></div>
      <div class="stat"><span>Jahresausgaben</span><b>${fmt(yr.out)}</b></div>
      <div class="stat"><span>Ø Ausgaben / Monat</span><b>${fmt(yr.avgOut)}</b></div>

      <div class="stat"><span>Schuldentilgung gesamt</span><b>${fmt(yr.debtPaid)}</b></div>
      <div class="stat"><span>Gespart gesamt</span><b>${fmt(yr.saved)}</b></div>
    </div></section>
  <section><div class="sechead"><h2>Monatsvergleich</h2><span class="hint">${esc(monthName(cur))} vs. ${esc(monthName(prev))}</span></div>
    <div class="panel tbl-wrap"><table><thead><tr><th class="l">Bereich</th><th>${esc(monthOnly(prev))}</th><th>${esc(monthOnly(cur))}</th><th>Differenz</th></tr></thead><tbody>
      ${cmp.map(r=>`<tr class="${r.tot?'tot':''}"><td class="l">${esc(r.l)}</td><td>${fmt(r.a)}</td><td>${fmt(r.b)}</td><td class="${r.d>0&&r.cost?'neg':r.d<0&&r.cost?'pos':''}">${fmtS(r.d)}</td></tr>`).join('')}

  <section><div class="sechead"><h2>Datensicherung</h2></div>
    <div class="panel"><div class="rows">

function yearSummary(y){
  const rows = []; let income=0,out=0,saved=0,debtPaid=0,n=0; const cats={};
  for(let i=1;i<=12;i++){
    const key = `${y}-${pad(i)}`, has = !!months[key];
    const c = has ? calcM(key) : null;
    if(has){ n++; income+=c.income; out+=c.out; saved+=c.goalsDone; debtPaid += c.repaid + c.paidFor + c.credits; Object.entries(c.byCat).forEach(([k,v])=>cats[k]=(cats[k]||0)+v); }
    rows.push({key, has, c});
  }
  const top = Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  return {rows, income:r2(income), out:r2(out), saved:r2(saved), debtPaid:r2(debtPaid), avgOut: n?r2(out/n):0, topCat: top?{name: top[0]==='_none'?'Ohne Kategorie':catName(top[0]), v:r2(top[1])}:null};
}
function compareMonths(a, b){
  const ca = calcM(a), cb = calcM(b);
  const rows = [
    {l:'Einnahmen (tatsächlich)', a:cb.income, b:ca.income},
    {l:'Feste Kosten (bezahlt)', a:cb.fixedPaid, b:ca.fixedPaid, cost:1},
    {l:'Schulden-Rückzahlungen', a:cb.repaid, b:ca.repaid, cost:1}
  ];
  new Set([...Object.keys(ca.byCat), ...Object.keys(cb.byCat)]).forEach(id=>rows.push({l:id==='_none'?'Ohne Kategorie':catName(id), a:cb.byCat[id]||0, b:ca.byCat[id]||0, cost:1}));
  rows.push({l:'Ausgaben gesamt (tatsächlich)', a:cb.out, b:ca.out, cost:1, tot:1});
  rows.push({l:'Monatsergebnis', a:cb.left, b:ca.left, tot:1});
  rows.push({l:'Kontostand Monatsende', a:cb.available, b:ca.available, tot:1});
  rows.forEach(r=>r.d=r2(r.b-r.a));
  return rows;
}

/* Datenbindung: data-bind="S|pfad…" (Einstellungen) oder "M|pfad…" (aktueller Monat) */
function readBound(el){
  const tp = el.dataset.type;
  if(tp==='bool') return el.checked;
  if(tp==='amt') return parseAmt(el.value);
  if(tp==='amtneg') return el.value.trim()==='' ? null : parseAmt(el.value, true);
  if(tp==='actual'){
    if(el.value.trim()==='') return null;
    const acc = el.dataset.bind.split('|').pop(), prevAt = months[cur]?.actual?.[acc]?.at;
    const at = prevAt || (nowKey() > cur ? monthLastDay(cur) : todayStr());
    return {amount: parseAmt(el.value, true), at};
  }
  if(tp==='int') return parseInt(el.value,10)||1;
  if(tp==='month') return /^\d{4}-\d{2}$/.test(el.value) ? el.value : S.budgetStart;
  if(tp==='date') return /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : monthLastDay(cur);
  if(tp==='day') return Math.min(31, Math.max(1, parseInt(el.value,10)||1));
  return el.value.trim();
}
function setPath(root, segs, val){
  let o = root;
  for(let i=0;i<segs.length-1;i++){
    const s = segs[i];
    if(Array.isArray(o)){ o = o.find(x=>x.id===s); if(!o) return; }
    else { if(o[s]==null || typeof o[s]!=='object') o[s] = {}; o = o[s]; }
  }
  const last = segs[segs.length-1];
  if(Array.isArray(o)) return;
  if(val===null) delete o[last]; else o[last] = val;
}
function applyBound(el, save){
  const [root, ...segs] = el.dataset.bind.split('|');
  const val = readBound(el);
  if(root==='S'){
    if(segs[0]==='budgetStart'){
      if(!save) return;
      // Nur die Einstellung ändert sich – keine Buchungen, Monate oder Start-/Enddaten werden angefasst
      editSettings(s=>{ s.budgetStart = val; });
      toast(`Budgetverwaltung beginnt jetzt im ${monthName(val)}.`);
      return;
    }
    if(segs[0]==='payday' && payMode()){
      if(!save) return;
      if(val < 2){ toast('Für einen Gehaltsmonat muss der Gehaltstag nach dem 1. liegen. Stelle sonst „Monat beginnt am“ auf den 1.'); render(true); return; }
      const n = changeMonthRule(s=>{ s.payday = val; }, 'vor Änderung des Gehaltstags');
      toast(`Gehaltstag ${val}. – Monate laufen jetzt vom ${val}. bis zum ${val-1}.${n?` ${n} Buchung${n===1?'':'en'} neu zugeordnet.`:''}`);
      return;
    }
    editSettings(s=>setPath(s, segs, val), save);
    if(save && segs[0]==='recurring' && segs[2]==='amount') propagatePlan('plan', segs[1], val);
    if(save && segs[0]==='incomes' && segs[2]==='amount') propagatePlan('incomePlan', segs[1], val);
  } else {
    if(isClosed(cur)){ if(save) lockedMsg(cur); return; }
    editMonth(cur, m=>setPath(m, segs, val), save);
  }
}
/* Betragsänderung einer Vorlage gilt für aktuellen + künftige, noch offene, nicht abgeschlossene Monate */
function propagatePlan(field, id, val){
  const now = nowKey();
  Object.keys(months).forEach(k=>{
    if(k < now || isClosed(k)) return;
    const p = months[k][field]?.[id]; if(!p) return;
    if(p.paidTx || p.tx) return;
    p.amount = val; persistMonth(k);
  });
}

function carryOver(key, src){
  if(!managed(shiftMonth(key,-1)) || !managed(key)){ toast('Ein Übertrag gibt es erst ab dem Startmonat der Budgetverwaltung.'); return; }
  const prev = shiftMonth(key,-1); const pb = balances(prev);
  const ok = editMonth(key, m=>{ if(src==='actual'){ m.opening = {}; pb.rows.forEach(r=>{ m.opening[r.a.id] = r.actual!=null ? r.actual : r.calc; }); } else delete m.opening; });
  if(ok) toast(src==='actual' ? `Startguthaben ${monthName(key)}: tatsächlicher Endsaldo übernommen.` : `Startguthaben ${monthName(key)} wird automatisch aus ${monthName(prev)} übernommen (${fmt(pb.total)}).`);
}
function closeMonth(key){
  autoBackup('vor Monatsabschluss');
  const c = calcM(key), bal = balances(key);
  const open = [...incomeItems(key).filter(i=>!i.skip&&!i.received).map(i=>`Einnahme ${i.i.name} ${fmt(i.amount)}`), ...planItems(key).filter(p=>!p.skip&&!p.paid).map(p=>`${p.r.name} ${fmt(p.amount)}`)];
  const snap = {opening:c.opening, income:c.income, out:c.out, repaid:c.repaid, paidFor:c.paidFor, saved:c.goalsDone, savedPlanned:c.goalsPlanned, result:c.left,
    closing: bal.total, accounts: bal.rows.map(r=>({id:r.a.id, name:r.a.name, opening:r.opening||0, closing:r.calc, actual:r.actual})), open};
  const wasAuto = bal.rows.filter(r=>r.openingSrc==='auto').map(r=>r.a.id);
  editMonth(key, m=>{ m.opening = {...(m.opening||{})}; bal.rows.forEach(r=>{ if(r.openingSrc!=='none') m.opening[r.a.id] = r.opening; }); m.closed = {at:new Date().toISOString(), snap, autoOpening: wasAuto}; });
  const next = shiftMonth(key,1);
  toast(`${monthName(key)} abgeschlossen. Startguthaben ${monthName(next)}: ${fmt(bal.total)}.`);
}

const CRC = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc = new TextEncoder(); const parts=[]; const central=[]; let off=0;
  for(const f of files){
    const name = enc.encode(f.name), data = typeof f.data==='string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,0,true); h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,0,true); c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + data.length;
  }
  const csize = central.reduce((a,x)=>a+x.length,0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csize,true); e.setUint32(16,off,true);

}

function plainDownload(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},60000); }
/** Datei an den Nutzer geben. Handy/Tablet: Teilen-Menü („In Dateien sichern“, WhatsApp, Mail …) – Computer: Download. */
function downloadBlob(blob, name, label){
  const touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  if(touch && navigator.canShare && navigator.share){
    let file = null; try{ file = new File([blob], name, {type: blob.type || 'application/octet-stream'}); }catch(e){}
    if(file && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:name}).then(()=>toast(`${label||'Datei'} gesichert.`)).catch(err=>{
        if(err && err.name==='AbortError') return;          // selbst abgebrochen
        fallbackOpen(blob, name, label);
      });
      return;
    }
  }
  fallbackOpen(blob, name, label);
}
function fallbackOpen(blob, name, label){
  if(isStandalone() && blob.type==='application/pdf'){ const w = window.open(URL.createObjectURL(blob), '_blank'); if(w){ toast('PDF geöffnet – dort über „Teilen“ sichern.'); return; } }
  plainDownload(blob, name); toast(`${label||'Datei'} wird heruntergeladen.`);
}

function specHtml(sp){

  return rHead(sp.title, sp.sub)
    + (sp.sums ? `<div class="sum">${sp.sums.map(([l,v,hl])=>`<div${hl?' class="hl"':''}><span>${esc(l)}</span><b>${esc(v)}</b></div>`).join('')}</div>` : '')
    + sp.blocks.map(b=>`${b.h?`<h2>${esc(b.h)}</h2>`:''}<table>${b.head?`<thead><tr>${b.head.map((h,i)=>cell(h,i,b,'th')).join('')}</tr></thead>`:''}<tbody>${b.rows.length

/** Bericht als echte PDF-Datei (eigener Generator, offline, ohne Druckfunktion) */
function specPdf(sp){
  const pdfTxt = v => String(v==null?'':v).replace(/[\u00a0\u202f]/g,' ');
  const G = [14,122,95], MUTED = [93,109,101], INK = [19,32,26], SOFT = [221,241,233], ZEBRA = [246,248,247], LINE = [214,221,216];
  const doc = new PdfDoc(), L = 42, R = doc.W - 42, CW = R - L, bottom = doc.H - 58;
  doc.rect(0, 0, doc.W, 80, G);
  doc.text(sp.title, L, 40, {size:19, bold:true, color:[255,255,255]});
  if(sp.sub) doc.text(sp.sub, L, 60, {size:10, color:[221,241,233]});
  doc.text(`Erstellt am ${fmtDate(todayStr())}`, R, 40, {size:9, color:[255,255,255], align:'right'});
  doc.text('Mein Monatsbudget', R, 54, {size:9, color:[221,241,233], align:'right'});
  let y = 104;
  if(sp.sums){
    const bw = (CW - 16)/3, bh = 44;
    sp.sums.forEach(([l,v,hl],i)=>{ const x = L + (i%3)*(bw+8), yy = y + Math.floor(i/3)*(bh+8);
      if(hl) doc.rect(x, yy, bw, bh, SOFT); doc.box(x, yy, bw, bh, hl?G:LINE);
      doc.text(String(l).toUpperCase(), x+10, yy+16, {size:7, bold:true, color:hl?G:MUTED}); doc.text(pdfTxt(v), x+10, yy+34, {size:13, bold:true, color:hl?G:INK}); });
    y += Math.ceil(sp.sums.length/3)*(bh+8) + 10;
  }
  const newPage = () => { doc.addPage(); y = 50; };
  for(const b of sp.blocks){
    const left = b.left || [0];
    const ncol = b.head ? b.head.length : 2;
    const rows = b.rows.length ? b.rows : [{c:[b.empty||'–'], empty:1}];
    // Spaltenbreiten: Zahlenspalten so breit wie nötig, die erste Spalte bekommt den Rest
    const wN = []; for(let i=1;i<ncol;i++){ let w = b.head ? pdfW(String(b.head[i]).toUpperCase(), 7.5, true) : 0; rows.forEach(r=>{ if(r.c[i]!=null) w = Math.max(w, pdfW(pdfTxt(r.c[i]), 9, !!r.tot)); }); wN.push(Math.ceil(w)+14); }
    let sumN = wN.reduce((a,v)=>a+v, 0);
    const minFirst = ncol>2 ? 110 : CW*0.55;
    if(CW - sumN < minFirst){ const f = (CW - minFirst)/sumN; for(let i=0;i<wN.length;i++) wN[i] = wN[i]*f; sumN = CW - minFirst; }
    const W = [CW - sumN, ...wN];
    const head = () => { if(!b.head) return; doc.rect(L, y, CW, 18, G); let x = L; b.head.forEach((h,i)=>{ const l = left.includes(i); doc.text(String(h).toUpperCase(), l ? x+6 : x+W[i]-6, y+12.3, {size:7.5, bold:true, color:[255,255,255], align:l?'left':'right'}); x += W[i]; }); y += 18; };
    if(y + (b.h?26:0) + (b.head?18:0) + 22 > bottom) newPage();
    if(b.h){ y += 8; doc.text(b.h, L, y+10, {size:12.5, bold:true, color:INK}); doc.line(L, y+16, R, y+16, LINE, .6); y += 24; }
    head();
    let zebra = false;
    for(const r of rows){
      const lines = doc.wrap(r.c[0], W[0]-12, 9, !!r.tot);
      const h = Math.max(18, 7 + lines.length*11);
      if(y + h > bottom){ newPage(); head(); }
      if(r.tot){ doc.rect(L, y, CW, h, SOFT); doc.line(L, y, R, y, G, 1); }
      else if(zebra) doc.rect(L, y, CW, h, ZEBRA);
      zebra = !zebra;
      let x = L;
      for(let i=0;i<ncol;i++){
        const v = r.c[i]; if(v==null || v===''){ x += W[i]; continue; }
        if(i===0) lines.forEach((ln,k)=>doc.text(ln, x+6, y+12.5+k*11, {size:9, bold:!!r.tot, color:r.empty?MUTED:INK}));
        else { const l = left.includes(i); doc.text(pdfTxt(v), l ? x+6 : x+W[i]-6, y+12.5, {size:9, bold:!!r.tot, align:l?'left':'right'}); }
        x += W[i];
      }
      if(!r.tot) doc.line(L, y+h, R, y+h, [228,233,230], .5);
      y += h;
    }
    y += 6;
  }
  if(sp.note){ const lines = doc.wrap(sp.note, CW, 8.5); if(y + lines.length*11 + 14 > bottom) newPage(); y += 10; lines.forEach((ln,i)=>doc.text(ln, L, y+i*11, {size:8.5, color:MUTED})); }
  doc.pages.forEach((pg,i)=>{ doc.c = pg; doc.line(L, doc.H-40, R, doc.H-40, LINE, .5);
    doc.text(`${sp.title} · Mein Monatsbudget`, L, doc.H-26, {size:8, color:MUTED});
    doc.text(`Seite ${i+1} von ${doc.pages.length}`, R, doc.H-26, {size:8, color:MUTED, align:'right'}); });
  return doc.output(sp.title);
}

async function startCloud(){
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}`;
  const [appM, authM, fsM] = await Promise.all([import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-firestore.js`)]);
  F = {...authM, ...fsM};
  const app = appM.initializeApp(firebaseConfig);
  fauth = authM.getAuth(app);
  try{ fdb = fsM.initializeFirestore(app, {localCache: fsM.persistentLocalCache({tabManager: fsM.persistentMultipleTabManager()})}); }
  catch(e){ fdb = fsM.getFirestore(app); }

  document.getElementById('l-toggle').onclick = ()=>{ signup=!signup; document.getElementById('l-submit').textContent = signup?'Konto erstellen':'Anmelden'; document.getElementById('l-toggle').textContent = signup?'Ich habe schon ein Konto':'Neues Konto erstellen'; document.getElementById('l-pw').autocomplete = signup?'new-password':'current-password'; showLoginError(''); };

    e.preventDefault(); showLoginError('');

    catch(err){ showLoginError(authMsg(err.code)); }
  };

    const mail=document.getElementById('l-mail').value.trim();
    if(!mail){ showLoginError('Gib oben deine E-Mail ein, dann schicken wir dir einen Link.'); return; }
    try{ await authM.sendPasswordResetEmail(fauth, mail); showLoginError(''); toast('E-Mail zum Zurücksetzen wurde gesendet.'); }catch(err){ showLoginError(authMsg(err.code)); }
  };

  authM.onAuthStateChanged(fauth, async u=>{
    unsub.forEach(f=>f()); unsub=[];
    user = u;
    if(!u){ mode='local'; S=normalizeS(makeDefaults()); months={}; document.getElementById('app').hidden=true; document.getElementById('login').hidden=false; return; }
    mode = 'cloud';
    // Erst einmal alles laden und bei Bedarf migrieren, dann live verfolgen
    let rawS = null, rawM = {};

      const sd = await fsM.getDoc(fsM.doc(fdb,'users',u.uid,'data','settings'));
      if(sd.exists()) rawS = sd.data();
      const md = await fsM.getDocs(fsM.collection(fdb,'users',u.uid,'months'));
      md.forEach(d=>{ rawM[d.id] = d.data(); });
    }catch(e){ toast('Daten konnten nicht geladen werden. Prüfe die Firebase-Regeln.'); }
    const needsMig = rawS && (rawS.v||0) < 3;

    if(res.migrated){ persistSettings(); Object.keys(months).forEach(k=>persistMonth(k)); }
    autoBackup();
    showApp();
    if(res.migrated) migrationNotice();
    unsub.push(fsM.onSnapshot(fsM.doc(fdb,'users',u.uid,'data','settings'), snap=>{
      if(!snap.exists()) return;
      const d = snap.data(); if((d.v||0) < 3) return;
      const ns = normalizeS(clone(d));
      if(JSON.stringify(ns)===JSON.stringify(S)) return;

    unsub.push(fsM.onSnapshot(fsM.collection(fdb,'users',u.uid,'months'), snap=>{
      const nm = {}; snap.forEach(d=>{ nm[d.id] = normalizeMonth(clone(d.data())); });
      if(JSON.stringify(nm)===JSON.stringify(months)) return;
      months = nm; render();
    }, ()=>{}));
  });
